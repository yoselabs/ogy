- id: checked-commit
  word: X
  says: The commit of the task branch that the task's checks passed on.
  src:
  - code:src/taskloop/land.py#_branch
- id: claim
  word: claim
  says: The tracker's mark that the factory works on a task; it lapses unless renewed.
  src:
  - code:src/taskloop/claim_lease.py#KeepAlive
- id: gate
  word: gate
  says: 'Whatever decides whether checks pass: checks, setup, required names, tool configs, tests.'
  src:
  - code:src/taskloop/land_gate.py#Gate
- id: land
  word: land
  says: "To finish a delivery: the change on origin's main and the task closed."
  src:
  - code:src/taskloop/land.py#land
- id: squash
  word: S
  says: The one commit holding the checked commit's whole change on the target tip.
  src:
  - code:src/taskloop/land_target.py#made_s
- id: target-tip
  word: O
  says: The commit origin's main pointed at when the squash was made.
  src:
  - code:src/taskloop/land_target.py#fetched_target
