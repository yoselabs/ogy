title: Lapsed claim found at the close
question: S is on main, the task's claim lapsed and nobody else took the task. Does the land close it?
context: >-
  The code refuses and names the close by hand. Closing it anyway would need a new step that takes the claim again,
  which an option cannot express (it sets fields of existing entries only).
src: ["code:src/taskloop/land_close.py#_by_hand"]
options:
