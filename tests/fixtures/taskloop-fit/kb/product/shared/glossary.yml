- id: checked-commit
  word: X
  says: The commit of the task branch that the task's checks passed on.
  src:
  - code:src/taskloop/land.py#_branch
- id: claim
  word: claim
  says: The tracker's mark that the factory is working on a task; it is taken when the task is admitted and lapses unless renewed.
  src:
  - code:src/taskloop/claim_lease.py#KeepAlive
- id: gate
  word: gate
  says: Everything that decides whether checks pass - the checks, their setup, the required names, tool configuration files and the tests.
  src:
  - code:src/taskloop/land_gate.py#Gate
- id: land
  word: land
  says: To finish a task's delivery - its change accepted on origin's main and the task closed in the tracker.
  src:
  - code:src/taskloop/land.py#land
- id: squash
  word: S
  says: The one commit that holds the checked commit's whole change on top of the target tip.
  src:
  - code:src/taskloop/land_target.py#made_s
- id: target-tip
  word: O
  says: The commit origin's main pointed at when the squash was made.
  src:
  - code:src/taskloop/land_target.py#fetched_target
