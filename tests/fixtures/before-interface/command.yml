kind: command
about: a command line or API call that serves actor steps
guidance: "A command line or API call that serves actor steps, as a view serves a screen; `offers` lists the choices when it offers only some. The code that does the work behind a row is a handler."
like: "a command line or an API call that serves actor steps"
unlike: "a CQRS command message; the handler behind a row"
shape: file
sentence: says
layers: [software]
needs_proof: true
fingerprint: {proofs: true}
fields:
  satisfies: {type: links, to: [rule], note: true, input: content}   # a rule it is held to changes: it is stale
  says: {required: true}
  invoked_as: {required: true}
  serves: {type: links, to: [step], required: true, input: {parts: [choice]}}   # the served steps' set of choices changes: stale
  offers: {type: links, to: [choice], input: none}
