says: The librarian lends a tool from the command line.
invoked_as: library borrow <tool> <member> [--parts <parts>]
serves:
- product/lending/workflow/borrow/step/ask
offers:
- product/lending/workflow/borrow/step/ask/choice/borrow
src:
- code:src/library/cli.py#borrow
form: cli
inputs:
  tool:
    says: The tool lent.
    of: product/lending/entity/tool
  member:
    says: The card number of the member who borrows.
  parts:
    says: The parts that go out with the tool.
    of: product/lending/entity/tool/attribute/parts
    optional: true
