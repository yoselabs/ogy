name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: just install
      - run: just check
      - run: just test
      - name: ogy check
        run: uv run --frozen --no-sync python -I -m ogy check --base origin/main
