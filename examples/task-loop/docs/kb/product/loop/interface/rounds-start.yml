says: The command that repeats rounds in the foreground until Ctrl-C.
form: cli
invoked_as: tl rounds start --backlog <key> --label <label>
serves:
- product/loop/workflow/round/step/run
offers:
- product/loop/workflow/round/step/run/choice/repeat
src:
- code:src/taskloop/cli_step.py#_rounds
inputs:
  key:
    says: The backlog the round takes tasks from.
  label:
    says: Only tasks with this label.
