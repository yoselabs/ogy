- id: storage-is-a-projection
  says: 'The ontology is a graph of linked entries. How an entry is stored (its own file, an item in a list, inline in its parent) is a projection: no meaning and no address depends on it.'
  agreed:
    at: '2026-11-18T17:33:54+01:00'
    where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    said: Yes to all four
    hash: 30d1f93ef082
- id: intuitive-for-ai
  says: 'The ontology is designed to be intuitive for AI agents: an agent reading the kinds, the glossary and one entry can tell what it means, where it goes and what it links to, without hidden conventions.'
  agreed:
    at: '2026-11-18T17:33:54+01:00'
    where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    said: Yes to all four
    hash: d4a70ec388eb
- id: layers-split-business-from-technical
  says: 'What the business decides is kept apart from how it is built: a business fact lives in the product layer, a build fact in the software layer.'
  agreed:
    at: '2026-11-25T19:56:24+01:00'
    where: ai:claude/ontology-review-session-749f16
    said: Yes to all 9 of Fable's picks, read on the pet shop cards
    hash: d9c979d95e10
- id: rigid-where-checked
  says: A fact that a check, work left or impact reads is a field or a link; a fact only a reader needs is text on its entry.
  why: An all-rigid model grows as detailed as code and lags behind it; text that a check needs is a second, unchecked spec. Each fact takes the cheapest form that still lets the checks read it.
  agreed:
    at: '2026-11-19T19:11:42+01:00'
    where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    said: 'Owner delegated this round to Fable: keep inspect-kb, trim the decision entity, agree to committer and both principles'
    hash: 8ea41892be00
- id: one-owner-per-fact
  says: 'Each fact has one owner: a rule is a check or prose on its entry, never both; a copy elsewhere points to its owner.'
  why: Copies drift, and a rule kept in prose that a check could read hides the gaps the check would find.
  agreed:
    at: '2026-11-20T20:53:04+01:00'
    where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    said: 'Owner: I agree those (the two new principles)'
    hash: 4a55e35eb0a6
- id: fix-the-class
  says: 'A gap found is fixed for its whole class: every fix asks where else the same cause applies, and the answer becomes a check, work, or a listed item.'
  why: A fix that closes one case leaves its siblings hidden.
  agreed:
    at: '2026-11-20T20:53:04+01:00'
    where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    said: 'Owner: I agree those (the two new principles)'
    hash: a101fa87c7fd
- id: no-flexibility-until-needed
  says: 'The ontology gains no flexibility until a real case shows it is needed: no field, option or way to change the ontology ships on the chance a product may want it.'
  why: Unproven flexibility costs every writer a choice and every reader a branch, and taking a freedom back is harder than giving one.
  agreed:
    at: '2026-11-26T03:36:02+01:00'
    where: ai:claude/ontology-review-session-749f16
    said: 'Yes, agree to both principles: no flexibility until needed, words from known tools'
    hash: 8ed78ae20b8a
- id: words-from-known-tools
  says: ogy takes its words from vocabularies people already know from popular tools and methods, such as GitHub, Figma and Domain-Driven Design, each for its own domain; a word none of them uses needs a decision.
  why: Most readers know technical or business English, not native English.
  agreed:
    at: '2026-11-26T03:36:02+01:00'
    where: ai:claude/ontology-review-session-749f16
    said: 'Yes, agree to both principles: no flexibility until needed, words from known tools'
    hash: 6d17a80b2132
- id: missing-is-computed
  says: What is missing is computed from the entries and their rules, never marked by hand.
  why: 'The owner, 2026-11-27: all the cases when some data is missing should be calculated from the ontology data and its field rules; he was asked six times, one kind at a time, whether a gap is work.'
  agreed:
    at: '2026-11-27T04:36:54+01:00'
    where: ai:claude/ontology-review-session-749f16
    said: "Yes to Fable's picks: the principle that what is missing is computed, row type from its rule, no-capability for goals, both to-do rules, card 13 as reworded, the because line as shortened"
    hash: 154a71f176b8
