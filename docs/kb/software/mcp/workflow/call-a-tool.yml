says: An MCP client calls an ogy tool and gets what the same CLI command returns.
src:
- code:src/ogy/mcp_server.py#_run
trigger: actor
start: call
steps:
  call:
    says: The client calls a tool with the command's arguments; --repo, --rev and --ontology are inputs of every tool.
    actor: product/people/actor/mcp-client
    choices:
      call:
        label: Call the tool
        then: run
  run:
    says: ogy runs the CLI command in its own process and prints tables and records for an agent.
    cases:
      error:
        order: 1
        when:
          text: the command ends with a usage error, a refusal or not found (exit 2 to 4)
          reads:
          - software/cli/set/exit-codes
        then: tool-error
      otherwise:
        then: result
ends:
  result:
    result: success
    says: The client gets the exit code and the output.
  tool-error:
    result: failure
    says: The client gets a tool error with the reason.
