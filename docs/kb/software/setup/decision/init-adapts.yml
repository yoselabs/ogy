question: What does `ogy init` write when the knowledge base is new, and what does it do when one exists?
options:
  adaptive:
    label: Starter actors owner and agent as ordinary entries; init creates what is missing and migrates what exists
    sets:
      software/setup/rule/init-adapts:
        says: '`ogy init` writes the actors owner (human) and agent (ai) in product/shared as ordinary entries nobody has agreed; it adapts like a migration: with nothing there it creates, with something there it finds what is missing or outdated and addresses it, and it never re-adds what was removed.'
  built-in:
    label: Built-in starter actors read from the package; init writes none
    sets:
      software/setup/rule/init-adapts:
        says: The starter actors owner and agent are built in and read from the installed package; `ogy init` writes no actor entries and only repairs what is missing.
proposal:
  chose: adaptive
  why: Ordinary entries can be renamed, agreed and removed like any other; a built-in would be a second source of actors.
  heard: init creates what is missing and migrates what exists.
answers:
- chose: adaptive
  said: init creates what is missing and migrates what exists.
  at: '2026-11-18T21:41:14+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
