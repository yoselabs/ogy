says: ogy init reads every file it merges into before it writes any.
src:
- code:src/ogy/init.py#init
start: run
steps:
  run:
    says: A person runs ogy init.
    actor: product/shared/actor/owner
    choices:
      init:
        label: Set up
        then: read
    agreed:
      at: '2026-11-21T01:42:56+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to what Fable judged true against the code'
      hash: b3bc836f5042
  read:
    says: ogy init reads ogy.yml, AGENTS.md, CLAUDE.md, .mcp.json, .claude/settings.json, the prek config, core.hooksPath and the flags.
    cases:
      unreadable:
        order: 1
        when:
          text: a file it reads is not UTF-8, cannot be read or is not of the shape it merges into, a file stands where it needs a folder or a folder where it writes a file, another tool owns core.hooksPath, no land branch is given or named by the remote, the flags contradict ogy.yml, or the ontology named is unknown (a usage error)
          reads:
          - software/setup/dependency/claude-code
          - software/storage/dependency/git
        then: refused
      otherwise:
        then: all-read
    agreed:
      at: '2026-11-21T01:42:56+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to what Fable judged true against the code'
      hash: e044f277c0f8
ends:
