says: ogy init reads every file it merges into before it writes any.
src:
- code:src/ogy/init.py#init
start: run
steps:
  run:
    says: A person runs ogy init.
    actor: product/shared/actor/owner
    choices:
      init:
        label: Set up
        then: read
  read:
    says: ogy init reads ogy.yml, AGENTS.md, CLAUDE.md, .mcp.json, .claude/settings.json, the prek config, core.hooksPath and the flags.
    cases:
      unreadable:
        order: 1
        when:
          text: a file it reads is not UTF-8 or not of the shape it merges into, a file stands where it needs a folder, another tool owns core.hooksPath, no land branch is given or named by the remote, or the flags contradict ogy.yml
          reads:
          - software/setup/dependency/claude-code
          - software/storage/dependency/git
        then: refused
      otherwise:
        then: all-read
ends:
  refused:
    result: failure
    says: Nothing is written; the refusal says what is at fault.
  all-read:
    result: success
    says: Every file it merges into was read.
