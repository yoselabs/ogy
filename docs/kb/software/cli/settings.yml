- id: ontology
  says: The ontology folder in ogy/ontologies that the repository uses, software when unset; a --ontology flag overrides it.
  name: ontology
  src:
  - code:src/ogy/config.py#KEYS
- id: rev
  says: The commit reads see by default, or . for the worktree, which is what an unset rev reads; a --rev flag overrides it.
  name: rev
  src:
  - code:src/ogy/config.py#KEYS
- id: config-file
  says: The environment variable that names a settings file other than ogy.yml at the repository root.
  name: OGY_CONFIG
  src:
  - code:src/ogy/config.py#CONFIG_ENV
- id: land
  name: land
  says: The branch a land updates and every branch is checked against; ogy init records it (--land, else the remote default branch; with neither it refuses to guess), and with none the hooks refuse.
  src:
  - code:src/ogy/config.py#KEYS
