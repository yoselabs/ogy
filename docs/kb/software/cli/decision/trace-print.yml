title: A short printed trace from product to software
question: Does ogy print, for one workflow or area, each step with who acts, where it is reached, what each row changes, which handler performs it and its proof?
context: No command prints it; the board composes it in its own code. An agent reads many files to learn what one screen of text can say. The paths are serves, offers, performs, uses and proof.
options:
  show-prints:
    label: ogy show <workflow> and ogy show <layer>/<area> print the trace; no new command
  command:
    label: A new command, ogy trace
  board-only:
    label: Only the board composes it
  covered-by-work-address:
    label: ogy work <workflow address> prints this trace as part of the workflow's brief; ogy work <area> keeps meaning the work left in that area; ogy show stays the plain read of one entry
proposal:
  chose: covered-by-work-address
  why: 'The trace is the context needed to build the workflow, which ogy work <address> prints (work-brief, answered work-address): one print for one fact. A richer brief changes no fingerprint, so it can be built before the first tracker sync. Before: show-prints.'
answers:
- chose: covered-by-work-address
  said: "A on all eight of batch 1: readiness computed, stage filters, reverse links by field word, trace in a workflow's brief, the kind files the only owner of their lists, a ui scheme for the board, I don't know records nothing, kind files carry because"
