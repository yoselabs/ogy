title: Types of work in ogy work
question: Does ogy work say what type of work each row is, and for whom?
context: 'Problem: product work prints 91 rows; the 14 that ask why something exists are mixed with 55 that ask for a test, and live-answer-is-in-force prints twice, as unbuilt and as unused. Three computed types: meaning (the why is missing: a workflow with no capability, a goal with no pain; for the owner, or for an AI proposing it when recovering a system from code), model (the description is incomplete: unused, unhandled, no answer path; for the agent writing that layer), build (described but not proven: unbuilt, changed, removed; for the coding agent). Gap found: a new handler, attribute or step prints no build row today; repair: ogy work --since <rev> lists entries added, changed or removed since that commit.'
options:
  three-types:
    label: meaning, model, build; computed, never stored; each requires rule says which
  two-types:
    label: meaning and build only
  no:
    label: 'As today: one list'
  meaning-design-build:
    label: 'Three types named meaning (the why is missing), design (the description has a gap: a rule nothing checks, a state with no handler) and build (to implement or prove)'
  discover-design-build:
    label: 'Three types named discover (the why is missing: a capability with no goal or no workflow, a goal no capability realizes, a workflow that realizes no capability), design (the description has a gap) and build (to implement or prove)'
  type-from-rule:
    label: "Each row's type comes from its rule, not from a list of kinds: why missing when the unmet rule follows a why link upward (because, realizes), design for any other gap below, build for a missing proof; the list discover is dropped"
proposal:
  chose: type-from-rule
  why: "Fable audit (2026-11-27): the heading 'the why is missing' is chosen by a hand list of kinds and 7 of its 13 rows in ogy are not about a missing why (no-workflow on a capability). The owner's split, upward and downward missing links, sorts them from the rule itself, as requirements traceability does (orphans upward, uncovered downward)."
  heard: There are upward and downward missing dependencies; everything missing should be calculated from the ontology data and its field rules.
  at: '2026-11-27T04:23:50+01:00'
answers:
- chose: discover-design-build
  said: Yes to all 9 of Fable's picks, read on the pet shop cards
  at: '2026-11-25T19:57:05+01:00'
  where: ai:claude/ontology-review-session-749f16
- chose: type-from-rule
  said: "Yes to Fable's picks: the principle that what is missing is computed, row type from its rule, no-capability for goals, both to-do rules, card 13 as reworded, the because line as shortened"
