title: Whether ogy has screens
question: The software ontology has an interface kind; a screen is an interface of form web. ogy prints text on a terminal and returns tables and records over MCP. Does its knowledge base hold a screen beside its command lines?
context: 'Found on 2026-11-18: view was the one kind left without an entry after capture from code. On 2026-11-20 view and command merged into interface (owner, bead ogy-yy9.75); this decision now asks about a web interface.'
options:
  none:
    label: 'No: ogy has no screens; its command line interfaces serve every actor step'
    sets:
      software/cli/interface/review-cards:
  review-cards:
    label: The printed review round is a screen, an interface of its own
    sets:
      software/cli/interface/review-cards:
        says: 'The review round as printed: a count per area, then numbered cards with their options and the reply line.'
        serves:
        - product/review/workflow/review-and-reply/step/reply
        src:
        - code:src/ogy/render.py#render_review
        form: web
  one-board:
    label: 'One screen: the board served by ogy view; the printed review round and other printed cards are still not screens'
    sets:
      software/cli/interface/review-cards:
proposal:
  chose: one-board
  why: The owner answered a served board as the canvas; the earlier none was about printed commands and says nothing against one web interface.
answers:
- chose: none
  delegated: software/writes/decision/capture-judgement
  said: 'The agent found no view: ogy has no screens'
  at: '2026-11-18T11:07:10+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
- chose: none
  said: Kept no-views and YAML-only glossary; agreed to the five sentences
  at: '2026-11-19T17:58:26+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
- chose: one-board
  said: 'ogy needs a browser view: the board is the one screen, so the old no-screens answer no longer holds.'
  at: '2026-11-22T03:12:33+01:00'
  where: ai:claude/f6fcc5ed
