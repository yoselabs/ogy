title: Name of the product map command
question: What is the command that renders the product map web page called?
context: Follows product/inspection/decision/product-map. The command reads the knowledge base and writes one web page.
options:
  view:
    label: ogy view
    sets:
      software/cli/interface/view:
        says: "Render the product's areas as one web page: a sitemap to dive into, a narrative per area, later a mock per workflow."
        invoked_as: ogy view
        form: cli
        serves:
        - product/inspection/workflow/inspect-kb/step/read
  map:
    label: ogy map
    sets:
      software/cli/interface/view:
  view-board:
    label: Keep ogy view and describe its answered canvas purpose
    sets:
      software/cli/interface/view:
        says: Deliver the product canvas and its entry details using the shared inspection data.
        invoked_as: ogy view
        form: cli
        serves:
        - product/inspection/workflow/inspect-kb/step/read
  serve:
    label: 'Rename to ogy serve: a command that runs the board server'
    sets:
      software/cli/interface/view:
        says: "Run the local board server: the product canvas, its entry details and the owner's answer page, over one API."
        invoked_as: ogy serve
        form: cli
        serves:
        - product/inspection/workflow/inspect-kb/step/read
proposal:
  chose: serve
  why: The owner said the command should be called ogy serve; it runs a server, it does not render a page.
  heard: Wants the command renamed to ogy serve.
answers:
- chose: view
  said: Chose the name ogy view for the product map command.
  at: '2026-11-21T03:17:21+01:00'
  where: ai:claude/f6fcc5ed-ca7f-47d9-9222-688756982c4e
- chose: serve
  said: The command should be named ogy serve; it runs a server, it does not render a page.
