title: Who reviews what waits for the owner
question: Does Fable review the entries waiting for the owner's eye and fix what is wrong, or does the owner review them first?
context: The knowledge base is a proof of concept; wiping and recreating code, ontology and information costs nothing now.
options:
  fable-reviews:
    label: Fable reviews what waits for the owner and fixes what is wrong; agreements stay the owner's
    sets:
      software/ontology/rule/review-delegation:
        says: Fable reviews the entries waiting for the owner and fixes what is wrong; an agent records each fix's answer under this delegation, and only the owner agrees to a sentence.
  owner-reviews:
    label: The owner reviews each waiting entry first
    sets:
      software/ontology/rule/review-delegation:
        says: The owner reviews each waiting entry before any fix.
proposal:
  chose: fable-reviews
  why: The owner asked for Fable's review.
answers:
- chose: fable-reviews
  said: Fable reviews what waits for me and fixes what is wrong; change costs nothing now
