title: A challenged concept is judged as if proposed today
question: Does the constitution gain a principle that what already exists earns no weight from existing, and that a challenged kind, field or link is judged as if it were proposed today?
context: "Today nothing says that work already done is no reason to keep a concept. Example: interface sits in the software layer because it was written there first; no decision chose that, yet on 2026-11-24 reviews counted the cost of moving it as a reason to keep it. The principle is a way to judge and costs nothing by itself: when someone challenges interface, the question is 'would we add it to software if we started today?'. A full test run is the costly part; when it runs is zero-base-when. Principle text (written with the answer): What exists earns no weight from existing: a challenged kind, field or link is judged as if proposed today, and is rebuilt or dropped when it would not be added, however much must change. Why: work already done and the size of a change are not reasons; a concept kept for them costs every writer and reader after."
options:
  principle:
    label: Add the principle; the costly test of a whole concept runs only when zero-base-when says
  skill-only:
    label: No principle; only the ontology-designer skill gains the test
  no:
    label: No; a concept that exists stays unless it breaks a law
  merged:
    label: "No tenth principle: no-flexibility-until-needed becomes earned-on-a-real-case: 'Everything in the ontology earns its place on a real case, whether proposed today or already there: nothing is added on the chance it is wanted, and what would not be added today is rebuilt or dropped, whatever the change costs.'"
proposal:
  chose: merged
  heard: You introduced another principle which is quite similar; review our principles and merge what we could.
  why: 'The owner said it is close to a principle they already have: no-flexibility-until-needed is the entry test, judged-as-new the same test for what exists; one sentence holds both, and the constitution stays small. Before (2026-11-24): principle.'
