title: close-loan in the tool library
question: In the tool-library fixture, the step close-loan listens to a transition that nothing fires. Does close-loan perform the return itself, or does it only react and another workflow fires the return?
context: The fixture is the test of every kind and field (tests/test_tool_library.py). The unfired transition shows as a fault the redesign wants a check for. This changes the fixture only, after the owner decides.
options:
  performs-return:
    label: close-loan performs return, so the transition has a row that fires it
  reacts:
    label: close-loan reacts, and another workflow fires return
  reacts-with-return-workflow:
    label: close-loan stays the listener; a new workflow return-tool (the member hands the tool back) has the row that fires `return`, so `workflow.event` stays filled.
proposal:
  chose: reacts-with-return-workflow
  why: close-loan is the only `event:` in the fixture; having it fire its own transition would leave the field unused.
answers:
- chose: reacts-with-return-workflow
  said: "Yes to Fable's picks on batch 2: no new audience actors, software areas named after product areas, steps shared by calls, infrastructure later, the three unused rules, create always, the reached-state check, and the return workflow in the fixture"
  at: '2026-11-28T02:17:00+01:00'
  where: ai:claude/ontology-review-session-749f16
