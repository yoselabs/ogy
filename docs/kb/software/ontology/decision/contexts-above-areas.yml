title: Whether a knowledge base groups areas into contexts so one repository holds several systems
structure: true
question: Does a knowledge base group its areas into named contexts (for example the engine, the default ontology and the viewer) so that one repository holds several systems, or does it keep areas only, or one knowledge base folder per system?
context: 'Owner, 2026-11-21: the viewer is effectively a separate product from the engine and the default ontology; one repository should hold several without a pile of areas, and people cannot hold many contexts at once, so foreign systems should appear as boundary stubs. Codex read: an area is a topic and the area kind says it is not a DDD bounded context; a context is a model and language boundary, not necessarily a service; contexts as optional metadata keep addresses unchanged; risks are word-clash and avoid checks, the shared area, ogy move and the fixed knowledge base root. The business versus software split and nesting (C4 system, container, component) are undecided.'
options:
  areas-only:
    label: 'Areas only: a system is a naming convention over areas'
  contexts:
    label: 'Contexts: an optional context grouping areas, with commands and the board taking a context filter and showing neighbours as boundary stubs; addresses unchanged'
  separate-knowledge-bases:
    label: One knowledge base folder per system, with qualified references between them
proposal:
  chose: contexts
  why: Keeps one history and cross-system links with the smallest change; the first step is a context filter prototype on the board with a temporary area-to-context mapping.
  heard: The viewer, the engine and the default ontology are different systems; one repository should hold them without too many areas.
answers:
- chose: contexts
  said: 'Approved the verdict table: contexts group areas, glossary isolation not approved.'
  at: '2026-11-21T22:32:03+01:00'
  where: ai:claude/f6fcc5ed
  note: 'Hedged: "Yes, I guess."'
