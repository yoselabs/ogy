title: Where an earlier proposal stays
question: When an agent changes the proposal of a decision, where do the earlier proposal and what moved it stay?
context: "Today a proposal is rewritten in place. Example: actor-layers proposed by-layer, then product-only on 2026-11-24; nothing in the knowledge base shows the change, and ogy history prints only answers. With a list, each proposal stays with its time and what moved it, as answers do. Only a decision's proposals and answers are a log; entries (workflows, rules, interfaces) still change and get removed, and removed.yml keeps why. About 224 decisions migrate."
options:
  proposal-list:
    label: 'A decision keeps its proposals as a list, as it keeps answers: a new one is appended with its time, an earlier one is never edited (checked against the base commit), the last is in force. Its `why` says what moved it. ogy show, the board and ogy history print the current proposal and answer first, then the earlier turns as History, newest first: what was proposed and why, what was answered and said'
  before-field:
    label: One proposal; it gains `before` (the option it replaced) and `moved` (one line). One step is kept, the others stay in Git
  git-only:
    label: 'No field: ogy history prints proposal changes from Git; changes made inside one commit are lost'
  as-today:
    label: "As today: the agent writes 'Before: ...' in `why` when it remembers"
proposal:
  chose: proposal-list
  why: 'Answers are already a log; the proposal is one slot, so the reason for a pick and against the others is lost on every change. The history is computed from the two logs, not moved into a field: moving would rewrite records checked as never edited, and a stored current beside the log is a second home. What the owner sees is the same: one current answer on top, History under it. About 224 decisions migrate.'
  heard: When we return to an earlier choice we must recall why it was made and why the other was not; keep one current answer with a history underneath.
answers:
- chose: proposal-list
  said: Agrees to keep the history of decisions; it would be quite useful
