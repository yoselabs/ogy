question: Must an attribute of type list name what it holds in `of`, when its items are plain texts (sources, hashes, answers, cards) that no entity or set describes?
structure: true
context: 'Bead ogy-yy9.53 asked for `type: one|list` needs `of`; seven list attributes of this knowledge base hold plain texts and have nothing to name, so only `type: one` is declared for now.'
options:
  one-only:
    label: 'Only `type: one` names `of`; a list of plain texts names nothing'
    sets:
      software/ontology/rule/list-attr-of:
        says: An attribute of type one names what it holds in `of`; an attribute of type list names nothing.
  every-list:
    label: 'Every `type: one` or `type: list` names `of`; plain texts get an entity or a set to name'
    sets:
      software/ontology/rule/list-attr-of:
        says: An attribute of type one or list names what it holds in `of`; a list of plain texts names the entity or set that describes them.
  of-and-many:
    label: An attribute names entries in `of` or has a plain `type`, never both; the flag `many` makes either a list (decision attribute-types)
    sets:
      software/ontology/rule/list-attr-of:
        says: An attribute that holds entries names them in `of`; one that holds plain values has a `type`; `many` makes either a list.
proposal:
  chose: one-only
  why: A list of hashes or sources has no entity to name, and inventing one adds kinds of entries nobody asked for.
answers:
- chose: one-only
  said: Took every recommendation of Fable's revised round
  at: '2026-11-19T17:47:11+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
- chose: of-and-many
  said: 'Yes, all: mainstream renames'
  at: '2026-11-20T00:34:29+01:00'
