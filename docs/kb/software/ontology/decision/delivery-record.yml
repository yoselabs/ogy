title: How an entry says it is delivered
question: Where do the code, tests, commits, date, author and task of a built entry live?
context: The owner wants every provable entry to say where it is built, which tests hold it, in which commits, when, by whom and under which task. proof and the built line exist; commit, date and author are reserved as computed; a task has no home. 0 of 49 rows carry a proof and no built folder exists.
options:
  computed:
    label: 'Nothing new stored: show prints handler and code, interfaces, proof, built or not, and the last commit, date and author from Git; the task is read from the commit message'
  stored-block:
    label: A delivered block stored on each entry
  task-field:
    label: As computed, plus a stored task field
  tracker-names-the-entry:
    label: "Nothing new stored in the entry: a tracker item names the entry's address and fingerprint; show prints proof, built and the Git facts"
proposal:
  chose: tracker-names-the-entry
  why: "What a task is for is a fact about the task, so the tracker holds it, keyed by the entry's permanent address; a bead id on the entry would be one fact in two homes and name one tracker (principle one-owner-per-fact). Decision work-to-tracker builds on it. Before: computed."
  heard: Mark in the ontology which bead is a task for which work.
answers:
- chose: tracker-names-the-entry
  said: "Yes to Fable's picks: ogy work prints the tracker items and a runner applies them, the tracker names the entry, and the pain and goal of tasks that drift"
  at: '2026-11-27T23:17:03+01:00'
  where: ai:claude/ontology-review-session-749f16
