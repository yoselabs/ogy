title: A where for answers given in the board
question: May an answer's `where` name the board (scheme `ui`), besides `ai`, `bd` and a path?
context: '`answer.where` takes only ai:, bd: and path:. The board records a choice from a click and has no word for itself, so it writes `path:ogy-board/` (src/ogy/web/answers.py:25), stretching path to mean the board. All 459 `where` values in the knowledge base are `ai:`, so nothing migrates.'
options:
  yes:
    label: Add the scheme `ui`, for example `ui:board`
  no:
    label: Keep ai, bd and path only
  yes-ui-token:
    label: Add the scheme `ui`, as `ui:board/<token>`; the board stops writing `path:ogy-board/`.
proposal:
  chose: yes-ui-token
  why: The board stretches `path` to mean itself; all 352 existing `where` values are `ai:`, so nothing migrates.
answers:
- chose: yes-ui-token
