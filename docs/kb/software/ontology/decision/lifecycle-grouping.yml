title: Several lifecycles of one entity
question: When an entity has more than one lifecycle (a loan is requested, then lent, then returned; its fee is due, then paid), does ogy only report a state nothing reaches, or also group states into named lifecycles?
context: Final states stay computed. A second lifecycle is already expressible as an attribute `of` an enum, or as its own entity. The reached check would make a state no transition leads to work `unused`, in the same way as the other unused checks.
options:
  reached-check:
    label: Only the check that a state no transition leads to is work `unused`; a second lifecycle is an enum attribute or its own entity
  grouping:
    label: A lifecycle grouping field or kind on states, besides the check
  none:
    label: Neither
proposal:
  chose: reached-check
  why: One requires line on state. It finds 2 states in ogy's KB, both initial (entry nobody-agreed, decision question-waiting), so it depends on create-on-a-lifecycle; 0 in the fixture.
answers:
- chose: reached-check
  said: "Yes to Fable's picks on batch 2: no new audience actors, software areas named after product areas, steps shared by calls, infrastructure later, the three unused rules, create always, the reached-state check, and the return workflow in the fixture"
