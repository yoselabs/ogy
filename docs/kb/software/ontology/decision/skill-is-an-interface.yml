title: A skill the product ships for an AI actor
question: A workflow such as hand-over is done by an agent following a skill, not by ogy's code. What is that skill in the knowledge base, and what proves it?
context: "Owner, 2026-11-27: a workflow that does not exist in the software is either not in the knowledge base or work that needs a proof; maybe its implementation is an AI skill. Today: ogy's commands serve hand-over's steps (check, status, dropped); the skill section skills/ogy-capture/SKILL.md section 8 is what makes the agent do it, and nothing records it. Skill headings already name evals in prose ('evaluated: E8-E10', 'untested'). A proof today must be path.py::function, so an eval cannot be named."
options:
  interface-proved-by-eval:
    label: A skill is an interface of form skill, sourced from its skill section; a proof may name an eval record as well as a test, so an unproven skill is unbuilt work
  handler:
    label: A skill is a handler in the software layer
  outside:
    label: Skills stay outside the knowledge base; workflows an agent performs are never proven
  rendered-then-eval:
    label: An interface of form skill that serves workflow steps is rendered from those steps and proved by the render check; an eval proves only its hand-written parts; a guide is an interface of form skill, one concept
proposal:
  chose: rendered-then-eval
  why: 'Decision guide-kind was answered rendered: a guide for steps an actor performs is rendered from the workflow. A rendered skill is built when the file equals the render, a plain test; an eval checks only whether an agent follows it. Before (2026-11-27): interface-proved-by-eval, which missed guide-kind.'
  heard: Prefer deterministic logic over skills and prompts.
  at: '2026-11-27T20:15:04+01:00'
answers:
- chose: interface-proved-by-eval
  said: Likes describing a skill as an interface of form skill; an implementation may be a skill or deterministic logic
  at: '2026-11-27T20:08:04+01:00'
  where: ai:claude/ontology-review-session-749f16
  note: adds that deterministic logic should be preferred over skills and prompts
