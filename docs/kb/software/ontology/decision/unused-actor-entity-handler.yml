title: Unused checks for actor, entity and handler
question: Do actors, entities and handlers that nothing uses (an actor no step or goal names, an entity no attribute or row reads, a handler that performs no row) become work `unused`, as rules, quantities and enums already are?
context: 'Decision unused-is-work made unused work left, computed from links, and a kind declares it. Actor, entity and handler declare none, so an orphan stays invisible. Fix-the-class: the same cause applies to these three kinds. The library fixture may gain `unused` rows in its work table; it keeps its two unused rules on purpose.'
options:
  yes:
    label: Each of the three kinds declares an unused work requirement
  no:
    label: Leave them as they are
  yes-handler-performs:
    label: 'Each of the three declares unused work: an actor nothing links to; an entity nothing outside its own parts links to; a handler that performs no row (not a handler nothing links to: all 11 handlers have no inbound link).'
proposal:
  chose: yes-handler-performs
  why: An orphan stays invisible otherwise (fix-the-class); a check written on inbound links would flag all 11 handlers.
answers:
- chose: yes-handler-performs
  said: "Yes to Fable's picks on batch 2: no new audience actors, software areas named after product areas, steps shared by calls, infrastructure later, the three unused rules, create always, the reached-state check, and the return workflow in the fixture"
  at: '2026-11-28T02:17:00+01:00'
  where: ai:claude/ontology-review-session-749f16
