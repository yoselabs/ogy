title: A reference to a drawn design
question: Where does a workflow or an interface keep the reference to its drawn frame in a drawing tool?
context: "High-fidelity drawings stay outside ogy. src accepts two schemes, code and doc, and each must read a file. No entry needs a frame today: 24 of ogy's 27 interfaces are commands, 3 are web views, and none cites a frame."
options:
  evidence-scheme:
    label: A third scheme of src for an outside frame, one mechanism for every kind; ogy stores the reference and reads nothing
  field:
    label: A field on interface holding the frame reference
  not-now:
    label: Nothing until the first entry has a real frame; then the scheme
proposal:
  chose: not-now
  why: No real frame exists to reference; when one does, src already means where an entry comes from and covers workflow, step and interface alike.
answers:
- chose: not-now
  said: A on the last fifteen, with the shared-entries rule dropped because the kind files already say where shared entries live
