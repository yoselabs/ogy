title: Interfaces whose contract we do not own
question: How does ogy hold a contract another party owns (a published standard, a vendor's queue, an event feed we receive), and a ready-made list of such contracts with their guarantees?
context: "Counted 2026-11-27: 1 interface has form mcp (product/mcp/interface/mcp, built to a standard ogy does not own), 0 have form http or message; 0 of ogy's 6 dependencies realize an actor (1 in the tool library). Today such an interface is held by a dependency with a pin (fastmcp), its workarounds, quantities for limits, and a rule an interface or handler satisfies. No link runs from an interface to a dependency; no check compares our limit with theirs."
options:
  as-today:
    label: "Nothing new now: a dependency with its pin (the standard's version), a rule the interface satisfies, quantities for limits. Asked again with the first real interface built to an outside contract"
  follows-link:
    label: An interface gains a link to the dependency whose contract it follows
  shipped-list:
    label: Dependencies, their quantities and rules ship as read-only entries in a data package; a check compares our quantities with theirs
proposal:
  chose: as-today
  why: No real case to hold a design to; three cases before an abstraction. The first real record decides between a link and a shipped list.
