title: Interfaces whose contract we do not own
question: How does ogy hold a contract another party owns (a published standard, a vendor's queue, an event feed we receive), and a ready-made list of such contracts with their guarantees?
context: 'One real case exists: product/mcp/interface/mcp (form mcp) is built to a standard ogy does not own. It is held with what exists: the dependency fastmcp with its pin, and rules the interface and its handler are held to. No link runs from an interface to a dependency (the product layer never names one), and no check compares our limit with theirs. The tool library has 1 dependency that realizes an actor; ogy has 0.'
options:
  as-today:
    label: "Nothing new now: a dependency with its pin (the standard's version), a rule the interface satisfies, quantities for limits. Asked again with the second real interface built to an outside contract"
  follows-link:
    label: An interface gains a link to the dependency whose contract it follows
  shipped-list:
    label: Dependencies, their quantities and rules ship as read-only entries in a data package; a check compares our quantities with theirs
proposal:
  chose: as-today
  why: One real case is held with what exists (a dependency with its pin, rules), so it needs no new link or shipped list yet; three cases before an abstraction, and the second real one decides between a link and a shipped list.
answers:
- chose: as-today
  said: A on the last fifteen, with the shared-entries rule dropped because the kind files already say where shared entries live
