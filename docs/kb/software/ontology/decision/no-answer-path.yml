title: No answer from an outside system is a failure end with a no-answer path
structure: true
question: A row tells a system we do not own and no answer comes back. Is that a third end result (unknown), or a failure end the row owes a path to?
context: "Misfit M4 (bead ogy-yy9.29), from capturing task-loop's land area: every operation has an 'unavailable, a rerun is safe' end. A review found it is no third result but a negative case; the rule lived only in the capture skill's hazard pass."
options:
  failure-path:
    label: A failure end; the row owes a no-answer path and a rule on whether a repeat is safe, as work
    sets:
      software/ontology/rule/no-answer-is-a-failure-end:
        says: 'A row that tells a program actor or a dependency owes a no-answer path: a timeout, or a case ending in failure, on its step or the next, and a rule it satisfies on whether a repeat is safe; end.result stays success or failure.'
  third-result:
    label: Add a third value to end.result for a call nobody answered
    sets:
      software/ontology/rule/no-answer-is-a-failure-end:
proposal:
  chose: failure-path
  why: No answer ends the workflow in failure all the same; what differs is the recovery, and a check can read that it is there.
answers:
- chose: failure-path
  said: 'Owner: yes to all five (no-answer rule, term, prose removal, beads, sweep)'
  at: '2026-11-20T20:29:28+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
because:
- constitution/principle/rigid-where-checked
- constitution/principle/one-owner-per-fact
- constitution/principle/fix-the-class
