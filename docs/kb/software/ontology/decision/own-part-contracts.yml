title: A contract between two of our own parts
question: How does ogy hold the point where one part we own calls another (a backend API for our own frontend, a library seam, a call between two of our services)?
context: "1 case today: software/viewing/interface/inspection-data, form library, feeding the board and the commands; its serves repeats the board's 4 steps and handler derive-inspection says nearly the same sentence. No actor is on its other side. A code base of many services would have many such points. Related: infrastructure-view."
options:
  none-yet:
    label: 'No entry of its own: the handler that answers the call holds it in its sentence, rules and proof. Asked again with three real cases'
  handler-link:
    label: A handler may use another handler; the link is the contract
  software-interface:
    label: Interface stays a kind of both layers; a software one names no actor and is used by handlers
  one-kb-each:
    label: A part with its own contract keeps its own knowledge base; the caller reads it as a dependency
proposal:
  chose: none-yet
  why: One real case, and it duplicates a handler; three cases before an abstraction.
answers:
- chose: none-yet
  said: Ok to Fable's pick on all three, read on the pet shop cards
