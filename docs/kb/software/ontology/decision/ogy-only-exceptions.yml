title: What an ogy-only feature must show
question: What must be shown before the shipped ontology gains something only ogy's own knowledge base would use?
context: "Problem: ogy describes itself, so a field can be added because ogy's own entries want it (structure looked like one). With the principle, such a field needs a decision showing the other way is impossible or a year of work; without it, ogy's 197 decisions outvote the task loop and a2kay. Principle text (written with the answer, address constitution/principle/ogy-is-one-product-among-others): The shipped ontology is designed as if another team built ogy: ogy's own knowledge base is one example among the others, and a kind, field or check that only it would use ships only when a decision shows that doing without is impossible or would take at least a year to do right."
options:
  principle:
    label: Add the principle
  no:
    label: No principle; judged case by case
  clause:
    label: "No second principle. no-flexibility-until-needed gains one sentence: a case found only in ogy's own knowledge base counts when a decision shows that doing without is impossible or would take at least a year"
  covered-by-earned:
    label: "No clause and no second principle: ogy's own knowledge base is one case among the reference cases, judged by earned-on-a-real-case"
proposal:
  chose: covered-by-earned
  why: 'judged-as-new was answered merged; no-flexibility-until-needed is gone and earned-on-a-real-case holds the test inside the 300-word budget. Before: clause.'
answers:
- chose: covered-by-earned
  said: A on the last fifteen, with the shared-entries rule dropped because the kind files already say where shared entries live
