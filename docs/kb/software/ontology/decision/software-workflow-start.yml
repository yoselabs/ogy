title: How a software workflow is started
question: Product may not name software, so no product step can lead to a software workflow. How is a software workflow started without repeating an actor step?
context: '4 of 4 software workflows start with an actor step: 2 repeat a product actor step (init-reads-its-files, write-under-the-lock), 2 use the only software actors (pre-commit-check, call-a-tool). All four end in something the actor sees (refused, tool error, committed). 4 interface serves links point at these steps.'
options:
  fold-into-product:
    label: The four become cases of the product rows they detail, or product workflows (pre-commit-check, call-a-tool); a software workflow has no actor step and starts by schedule or event only
  details-link:
    label: A software workflow gains a link to the product row it details and counts as started through it; no actor step
  as-today:
    label: 'As today: a software workflow repeats the actor step'
  fold-two-detail-two:
    label: 'Mixed: pre-commit-check and call-a-tool move to product with their interfaces (their actors are product now); init-reads-its-files and write-under-the-lock stay in software, lose their repeated actor step and gain a link to the product row they detail'
proposal:
  chose: fold-two-detail-two
  why: Two of the four reach an outside actor directly, so they are product; the other two read the Git and Claude Code dependencies, which product may not name, and technical-refusal keeps them in software. Two real cases of a detailing flow meet no-flexibility-until-needed. Fable, 2026-11-26.
answers:
- chose: fold-two-detail-two
  said: Ok to Fable's pick on all three, read on the pet shop cards
  at: '2026-11-26T02:53:26+01:00'
  where: ai:claude/ontology-review-session-749f16
