title: Whether software areas mirror product areas
question: Should each software area build exactly one product area, and how does ogy hold that?
context: 'Example: the product area checks (what ogy check promises) is built by the software area checks: same name, easy to follow. The product area capture is built by handlers of the software areas writes, removal and review; storage holds no handler. The software area cli is named after a form and holds no handler and no interface since interfaces moved to the product layer. 11 product and 10 software areas share 5 names (checks, mcp, ontology, setup, shared). The question: should a software area carry the name of the product area it builds, and what does ogy do when it does not?'
options:
  measure:
    label: 'Computed and printed: software areas per workflow and product areas per software area; no check'
  work:
    label: Printed, and a software area that builds two product areas is work left
  mirror:
    label: A software area carries the name of its product area; anything else is a finding
  nothing:
    label: Nothing; areas of the two layers are independent
  guidance-measure:
    label: A guidance line on area (a software area carries the name of the product area it builds, or of a mechanism several areas share, never of a tier such as cli, api or database) and the printed measure; no check
proposal:
  chose: guidance-measure
  why: The area guidance says nothing on naming, so the writer had no line to follow. Shared mechanisms (storage, writes) are legitimate, so a check would mark them for good; a guidance line and a printed measure show the mismatch without a row that never clears.
