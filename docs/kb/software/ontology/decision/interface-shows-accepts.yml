question: How does an interface say what it shows and what it takes in?
context: "Harmony review finding 10 (D12 b'): a read leaves no trace; a page has no link to what it shows. Bead ogy-yy9.75, the query rule."
options:
  links:
    label: shows and accepts link to entities and attributes (content inputs); one that only shows may serve no step, one that accepts or offers serves a step
  step-shows:
    label: A step's shows field
  step-first:
    label: A step says what its actor is shown and gives; an interface serving it takes both from the step, as it takes its users; its own shows and accepts stay for one that serves no step
  step-and-interface:
    label: A step says what its actor is shown and gives, in product entities; an interface keeps shows and accepts for what only the build has
