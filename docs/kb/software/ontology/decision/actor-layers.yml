question: 'Which layer holds an actor: is it a party the business deals with (a customer, a payment provider), or does it exist only because of how the product is built (a scheduler, CI, an MCP client)?'
options:
  by-layer:
    label: Business actors in the product layer, technical actors in the software layer; no new field
    sets:
      software/ontology/rule/actors-split-by-layer:
        says: Business actors live in the product layer and technical actors (a scheduler, CI, a system calling us) in the software layer; no field marks the difference.
      constitution/principle/layers-split-business-from-technical:
        says: 'What the business decides is kept apart from how it is built: a business fact lives in the product layer, a build fact in the software layer.'
  by-field:
    label: One layer, and a field on the actor marks it business or technical
    sets:
      software/ontology/rule/actors-split-by-layer:
        says: Actors live in one layer and a field on the actor marks it business or technical.
      constitution/principle/layers-split-business-from-technical:
  business-party:
    label: An actor the business deals with lives in product whatever its nature; an actor that exists only because of how the product is built lives in software; no new field
    sets:
      software/ontology/rule/actors-split-by-layer:
        says: An actor the business deals with, whatever its nature (a customer, a payment provider, a carrier's notifier), lives in the product layer; an actor that exists only because of how the product is built (a scheduler, CI, a git hook, an MCP client) lives in the software layer; no field marks the difference.
      constitution/principle/layers-split-business-from-technical:
        says: 'What the business decides is kept apart from how it is built: a business fact lives in the product layer, a build fact in the software layer.'
  product-only:
    label: "Every actor lives in product, whatever its nature: an actor is always outside the product. The product's own clock is a workflow schedule, its own reaction an event; neither is an actor. An outside scheduler, CI, Git or an MCP client that calls us is a program actor in product"
    sets:
      software/ontology/rule/actors-split-by-layer:
        says: "Every actor lives in the product layer, whatever its nature: an actor is always outside the product. The product's own clock is a workflow schedule and its own reaction an event; neither is an actor."
      constitution/principle/layers-split-business-from-technical:
        says: 'What the business decides is kept apart from how it is built: a business fact lives in the product layer, a build fact in the software layer.'
proposal:
  chose: product-only
  why: "The 2 software actors (committer, mcp-client) are named only by the first step of one software workflow each; both are programs outside ogy that call it. A workflow already starts without an actor by schedule or event (tool library: remind, close-loan). Asked again on the owner's words of 2026-11-24."
  heard: All actors are outside the product, AI too; scheduled work has no actor.
