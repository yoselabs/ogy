title: The area of an interface that serves two areas
question: In which area does an interface live, and what happens when it serves steps of two areas?
context: 'Example: the command ogy check lives in product/checks and serves the step run of the workflow check-and-land. The end-of-session workflow hand-over in product/review has its own step where the agent runs ogy check, so the same interface serves steps of two areas. 4 of 27 interfaces do this: check (checks, review), show and history (inspection, capture), reply (review, capture). In all four the command does the same thing in both workflows. Where a command behaves differently per workflow it is already split by a flag: check --landing.'
options:
  steps-area:
    label: 'The step exists once: an interface lives in the area of the workflow that owns its step, and another workflow that needs the same step calls that workflow. An interface that still serves steps of two areas is listed as work. A command that behaves differently per workflow is split by a flag or subcommand, each its own interface'
  shared-area:
    label: An interface that serves two areas lives in the shared area of its layer
  form-area:
    label: 'As today: an interface lives in the area it was written in and may serve steps of any area; nothing is listed'
  split-command:
    label: Every command that serves steps of two workflows is split into subcommands or flags, one per workflow, even when it does the same thing in both
proposal:
  chose: steps-area
  why: 'In all four cases the command does the same thing in both workflows, so the duplicate is the step, not the command: hand-over runs the same check as check-and-land. A call removes it. Splitting is kept for a command that behaves differently, as check --landing does.'
