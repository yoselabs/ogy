title: Who writes a built line
question: "A built line records that an entry was as it is when its proof passed. Today no command writes one: only a move and the tests call it, ogy's own knowledge base has 0 built files and 82 unbuilt rows, and a proof is checked only for its spelling. Who writes a built line?"
context: 'Owner, 2026-11-27: worried that the proof and built system is untested and guarantees nothing. Found: built.stamp is called only by relocate.py; evidencecheck.py reads only that a proof looks like path.py::function; the task-loop case read unbuilt for all 52 rows though the code exists.'
options:
  test-run-writes:
    label: The test run in the gate reports which proofs passed and ogy writes their built lines, with fingerprint and commit; a proof must name a test that exists
  agent-command:
    label: An agent stamps a built line by a command after running the tests
  no-record:
    label: 'No built record: an entry with a proof counts as built'
  test-run-writes-fingerprint:
    label: 'As test-run-writes, built with two differences: the lines are written by a test run asked for with --ogy-stamp (just stamp), not by every gate run, because the gate runs in the Git hooks and writing there would leave files uncommitted; and a line holds the build hash and the src receipts, while the commit that adds it is read from Git, since a line cannot name the commit that holds it. A failed proof deletes its line'
proposal:
  chose: test-run-writes-fingerprint
  why: 'Built 2026-11-27 (ogy-3ud) and run on this knowledge base: 3 lines written. Writing in the hooks would dirty the tree after a push; a line cannot name the commit that holds it. Before (2026-11-27): test-run-writes.'
  at: '2026-11-27T22:11:43+01:00'
answers:
- chose: test-run-writes
  said: Good with the proof design
  at: '2026-11-27T20:08:31+01:00'
  where: ai:claude/ontology-review-session-749f16
  note: the agent's duty is to give the test ids and say whether it is built; maybe a separate agent seals a provable entry
- chose: test-run-writes-fingerprint
  said: 'Likes it all, but does not want ogy tied too much to pytest: much of what is proven is TypeScript, and soon Rust'
  at: '2026-11-27T22:22:10+01:00'
  where: ai:claude/ontology-review-session-749f16
  note: deterministic stamping later for sure; for now a skill on how to build with ogy is fine
