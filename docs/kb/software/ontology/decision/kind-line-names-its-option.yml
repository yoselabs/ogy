title: A kind-file line names its option
question: May a kind file's because name the option it comes from, and is a line naming an unanswered decision, or an option not in force, a landing finding?
context: Found by the audit of 2026-11-28 (friction ledger, 29 items; independent review agreed). Kind files name their reasons with because since 94f3d7d (kind-reasons, decision-items-close). A kind-file answer still has no work item; with this, the kind-file line itself can be written with the proposal and checked at land.
options:
  option-and-landing-check:
    label: 'Yes: because may name <decision>/option/<key>; a line naming an unanswered decision or an option not in force blocks a land'
  decision-only:
    label: 'As today: because names the decision only, and nothing checks the answer'
proposal:
  chose: option-and-landing-check
  why: A kind-file change can be written with its proposal and cannot land against the answer (principle deterministic-first); the hand-made task is no longer needed for new ones.
