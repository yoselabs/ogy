title: A decision names the pain that raised it
question: How does a decision link to the pain that made someone ask it?
context: "Pain: a goal now holds pains (why we do things), and a decision also says why (why this way); nothing connects them. Example: the pain 'the owner cannot read a decision plainly' (2026-11-24) raised decision-reads-plain; today only its context text says so. A pain is something that happened: no options, no choice. A decision is a choice among options. One pain can raise several decisions, and a pain may need none. Asked only if why-chain-on-board is answered pains-list."
options:
  raised-by:
    label: A decision gains an optional link raised_by to the pains that raised it. An entry's because still names the decision, so entry -> decision -> pain -> goal reads as one chain
  because-pain:
    label: because on an entry may also cite a pain directly
  context-only:
    label: "As today: the decision's context names the pain in words"
proposal:
  chose: context-only
  why: "Asked only under pains-list, which is withdrawn. The decision is the pain's home; the entry -> because -> decision chain already reaches it. Before: raised-by."
