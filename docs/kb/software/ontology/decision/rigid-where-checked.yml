title: Rigid where checked
structure: true
question: Which facts of an entry are rigid (a field or a link) and which are text on the entry?
context: 'Owner discussion on 2026-11-18 about environments, permissions, SLOs and stores: an all-rigid model grows as detailed as code and lags it (like UML round-trip); a hybrid risks text becoming a second, unchecked spec.'
options:
  hybrid:
    label: 'Hybrid: a field or link where a check, the work (fingerprint) or impact reads the fact; text on the entry where only a person or agent reads it'
    sets:
      constitution/principle/rigid-where-checked:
        says: A fact that a check, work left or impact reads is a field or a link; a fact only a reader needs is text on its entry.
        why: An all-rigid model grows as detailed as code and lags behind it; text that a check needs is a second, unchecked spec. Each fact takes the cheapest form that still lets the checks read it.
      software/ontology/rule/rigid-where-checked:
        says: A fact read by a check, the work derivation (fingerprint) or impact is a field or a link; a fact read only by a person or agent is text (`says`) on its entry; text naming another entry makes that part a link; a decided number is a value; when no kind fits, a rule with links and a proof, never a new kind; a new kind or field names the check that reads it. `ogy init` ships the principle rigid-where-checked and this guidance (docs/guidance.md, "Rigid where checked") to every repository.
  all-rigid:
    label: 'All rigid: every fact is a field or a link'
    sets:
      constitution/principle/rigid-where-checked:
        says: Every fact about the product is a field or a link of the ontology; free text only names and explains.
        why: What the checks cannot read cannot be kept true.
      software/ontology/rule/rigid-where-checked:
        says: Every fact is a field or a link; a fact with no field gets a new field or kind.
  hybrid-how-only:
    label: Hybrid, with the rule holding only the how-tos; the principle says why
    sets:
      constitution/principle/rigid-where-checked:
        says: A fact that a check, work left or impact reads is a field or a link; a fact only a reader needs is text on its entry.
        why: An all-rigid model grows as detailed as code and lags behind it; text that a check needs is a second, unchecked spec. Each fact takes the cheapest form that still lets the checks read it.
      software/ontology/rule/rigid-where-checked:
        says: Text naming another entry makes that part a link; a decided number is a value; when no kind fits, a rule with links and a proof, never a new kind; a new kind or field names the check that reads it. `ogy init` ships the principle rigid-where-checked and docs/guidance.md ("Rigid where checked") to every repository.
guess:
  chose: hybrid
  why: Checks, the work and impact need rigid facts; everything else as fields makes the model as detailed as code and it lags.
  heard:
    said: Adopt the hybrid; the test goes into the constitution and the guide, for every ontology, shipped with init.
answers:
- chose: hybrid
  said: Adopt the hybrid; the test goes into the constitution and the guide, for every ontology, shipped with init.
