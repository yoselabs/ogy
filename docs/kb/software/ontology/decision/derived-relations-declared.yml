title: Where derived relations are written
question: About 25 relations (an actor acts in a workflow, a step is told by an effect, a row is fired by a transition) are derived from links, and today each viewer computes them in its own code. Are they declared once in the kind files, or does each viewer compute its own?
context: 'Requirements are declared in kind files and never in Python, but derived relations are not, so the board re-invents them with its own words and the CLI cannot print the same. A declaration would be a `derived:` block per kind, a name and a path in the hop syntax of `requires` (for example on actor, `acts_in: ["<-actor"]`); `kindlint` validates it, inspection emits it. It is meaning, not drawing: icons, order and layout stay in the viewer.'
options:
  declared:
    label: A `derived:` block in the kind files; the engine computes once, CLI, MCP and board read the same names
  each-viewer:
    label: Each viewer computes what it needs
  reverse-by-field-word:
    label: The engine gives every reverse link under the field word it came from (an effect's `on` under its `do` word), the same in show, MCP, inspection and the board; no reverse gets a second name. A path of two hops or more is written in a kind file in the `requires` hop syntax, with no name of its own, only when a check or a shipped view reads it.
proposal:
  chose: reverse-by-field-word
  why: The shipped board reads 4 single-hop reverses and composes 2 longer paths in its own code (goal chain, what a workflow touches); derived is already a field name and acts_in would be a second name for actor.
answers:
- chose: reverse-by-field-word
  said: "A on all eight of batch 1: readiness computed, stage filters, reverse links by field word, trace in a workflow's brief, the kind files the only owner of their lists, a ui scheme for the board, I don't know records nothing, kind files carry because"
