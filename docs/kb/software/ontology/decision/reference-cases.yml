title: Reference cases for ontology design
question: Does the repository keep one knowledge base per product ogy must describe, written before ogy is adopted there, and where?
context: "tests/fixtures/taskloop-fit holds 31 files of two task loop areas (land, claim) with no workflow, interface or handler; tests/test_examples.py pins its exact findings, so it may not change freely. smaller-next-step chose examples first; judged-as-new names reference cases that do not exist. The task loop has a CLI and a dashboard server today; its MCP server and outside triggers are planned. The healthcare code is not at hand: that case is a sketch from the owner's description."
structure: true
options:
  examples-dir:
    label: A top-level folder examples/ with one knowledge base per case (task-loop, a2kay, healthcare as a sketch), written through ogy, and ogy's own docs/kb counted as the fourth. Each case lists what the ontology could not hold. One fixed list of competency questions sits beside them; every design pass answers each question per case. A sketch raises a question but proves no need alone
  fixtures:
    label: Grow tests/fixtures/taskloop-fit and add fixtures for the other products
  in-target-repos:
    label: 'No copies: adopt ogy in each product first and read its docs/kb'
  no:
    label: No reference cases; ogy's own knowledge base stays the only case
  start-small:
    label: 'examples/ as chosen, started small: the task loop first, and a simple pet shop storefront to find structural issues early; a2kay and the healthcare sketch later'
proposal:
  chose: examples-dir
  why: A fixture pins what the checker does and must not move; a reference case is design input and must show misfits. Adopting first lets an unproved ontology shape three products.
  heard: Try an examples directory that describes those projects before ogy is adopted in them.
answers:
- chose: examples-dir
  said: Yes to an examples folder; planned parts such as the MCP server and outside triggers may be written as hypotheses
  at: '2026-11-24T18:26:29+01:00'
  where: ai:claude/ontology-review-session-749f16
  note: the agent picks the hypotheses, aimed at testing ogy from different angles
- chose: start-small
  said: 'Start easy: the task loop, and a simple pet shop storefront to find structural issues early'
  at: '2026-11-24T19:07:55+01:00'
  where: ai:claude/ontology-review-session-749f16
