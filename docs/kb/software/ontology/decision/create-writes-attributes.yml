question: Does creating an entity write its attributes, for never-written?
context: "Stage 2b: taskloop-fit inserts land candidates by transition and docs/kb saves review rounds by create; a single declared switch (`|create` in attribute.yml's path) decides it."
options:
  counted:
    label: A create effect on the entity writes its attributes
  not-counted:
    label: Only a write effect or an accepting interface writes an attribute
proposal:
  chose: counted
  why: Creating a record sets its facts; otherwise every created entity needs a second write effect.
answers:
- chose: counted
  said: 'Yes: a create on an entity writes its attributes, the declared default (owner 2026-11-20)'
