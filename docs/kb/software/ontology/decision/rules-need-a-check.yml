title: Which rules the knowledge base keeps
question: Of the 74 rules in the knowledge base, 66 are linked to nothing and none carries a proof. Does the knowledge base keep only rules a check or a test could catch, and turn the rest into plain decisions, or keep every rule as it is?
context: 'Found 2026-11-22 by the ontology review. Most rules restate an answered decision or an agent habit. On 2026-11-27: 74 rules, 66 linked to nothing, none with a proof, 61 set by an answer in force; they make 66 of the 88 design rows of work left.'
options:
  keep-checkable:
    label: A rule stays only when a handler, interface, test or check can satisfy it; the others become plain decisions or are removed with a reason
  keep-all:
    label: Every rule stays as it is, and the work list explains the unlinked ones
  triage-by-catchability:
    label: 'A rule stays when an existing check, test or engine behaviour could catch it: it is linked to the handler or interface that models that check, and keeps its agreement; only a rule nothing could catch becomes a plain decision, removed with its own reason, one by one'
  link-or-reask:
    label: A rule an engine check already enforces stays and is linked with `satisfies` from a handler in software/checks that models that check, keeping its agreement; every other rule set by an answer in force is asked again on its own decision with an option that sets it null, because `ogy remove` alone cannot remove it
  proof-or-decision:
    label: "A rule stays when a test can prove it and no kind file already declares it: it is linked with `satisfies` from the handler or interface whose behaviour it states, or stands for the whole product with its proof, keeps its agreement and is work until it has a proof. A rule that repeats a kind-file check, an absence, a plan or an agent habit goes: its decision is asked again with an option that keeps the answer and sets the rule null; those re-asks are answered under one named delegation and listed for the owner's veto. No handler is written only to carry a rule."
proposal:
  chose: proof-or-decision
  why: "61 of 74 rules are set by an answer in force; the re-asks run under one named delegation (decision named-delegation) and are listed for the owner's veto, so they do not flood the owner with cards. Before (2026-11-25): the same option, each re-ask a card of its own."
  at: '2026-11-27T16:27:36+01:00'
answers:
- chose: keep-checkable
  said: "Follow Fable's recommendation: rules stay only when a check can catch them."
  at: '2026-11-22T15:44:52+01:00'
  where: ai:claude/f6fcc5ed
- chose: proof-or-decision
  said: Likes the rules design and its clean-up
  at: '2026-11-27T20:08:22+01:00'
  where: ai:claude/ontology-review-session-749f16
