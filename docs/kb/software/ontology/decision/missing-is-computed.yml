title: What is missing is computed
question: Does the constitution gain the principle that what is missing is computed from the entries and their rules, never marked by hand, so a later rule of the shape 'X without Y is a to-do' is written without asking the owner one kind at a time?
context: 'The owner, 2026-11-27 (paraphrased): every missing piece should be calculated from the ontology data and field rules; downward gaps are design in progress, upward gaps appear when reading old code or when something was written without a reason. Fable audit: no hand-kept marks exist today, but the owner was asked six times per kind (work-status-unserved, unserved-step-is-work, goal-realized-by-capability, capability-realized-by-workflow, workflow-owes-capability, pain-owes-a-follower).'
options:
  principle:
    label: What is missing is computed from the entries and their rules, never marked by hand.
    sets:
      constitution/principle/missing-is-computed:
        says: What is missing is computed from the entries and their rules, never marked by hand.
  no:
    label: 'No principle: each such rule is asked'
    sets:
      constitution/principle/missing-is-computed:
  absorbed:
    label: Absorbed into principle deterministic-first, which says the same for data and for prompts
    sets:
      constitution/principle/missing-is-computed:
proposal:
  chose: absorbed
  why: 'Decision deterministic-first was answered one-principle (2026-11-27): one sentence holds what a program can know and what a prompt carries; the constitution stays small. Before (2026-11-27): principle.'
  heard: OK to deterministic first.
  at: '2026-11-27T20:47:34+01:00'
answers:
- chose: principle
  said: "Yes to Fable's picks: the principle that what is missing is computed, row type from its rule, no-capability for goals, both to-do rules, card 13 as reworded, the because line as shortened"
