title: A pain nobody acted on
question: Is a pain that no goal and no decision cites work to do, listed with the why work?
context: 'Fable, the product-building process (2026-11-27): whatever the entry point, ogy work lists what is missing above and below, except a pain nothing cites: a confirmed pain can sit forgotten. Real case in words: the owner asked why decisions jump back and forth (owner-inputs, 2026-11-24), a pain with no goal. Today all 9 pains are cited, so no row appears now.'
options:
  discover-work:
    label: 'Yes: a pain no goal or decision cites is discover work, status unused, never a finding'
  as-today:
    label: 'No: a pain may stand alone without a row'
proposal:
  chose: discover-work
  why: The pain-first path then shows its next step, and nothing confirmed is forgotten.
