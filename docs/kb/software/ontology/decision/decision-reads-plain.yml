title: A decision shows its pain on one example
question: Does a decision show, in plain words, the pain it answers on one real example, and what each option makes possible or impossible on that example?
context: "Today a decision's context lists counts and addresses. Example: the owner read earned-entry-evidence on 2026-11-24 and could not tell what it changes. The same decision with an example: 'a review wants an mcp-tool kind for the task loop's MCP server, which is not built yet; with the old words it is refused, with the new words the planned server counts if its source is named.'"
options:
  example-field:
    label: 'A decision gains an optional field example: one real case in plain words, with what each option does to it. ogy review prints it first. ogy check requires it on a structural decision'
  guidance:
    label: Only the kind's guidance asks for it; no check reads it
  no:
    label: No; context as today
  reach-printed:
    label: ogy review prints, under each option, what it sets and what that reaches (computed, as the board's option reach already is). The decision kind's guidance asks for one real example in the context, with what each option does to it; no new field, no check
proposal:
  chose: reach-printed
  why: 'What an option changes is computed where it sets entries (deterministic-first). 105 of 129 decisions in software/ontology set nothing, so for those the example in the context is all a reader gets, and the guidance must ask for it. example-field required it on a structural decision, a mark the decision kind dropped. Goal fewest-questions, pain question-not-alone. Before: example-field.'
answers:
- chose: reach-printed
  said: A on the last fifteen, with the shared-entries rule dropped because the kind files already say where shared entries live
  at: '2026-11-28T02:33:49+01:00'
  where: ai:claude/ontology-review-session-749f16
