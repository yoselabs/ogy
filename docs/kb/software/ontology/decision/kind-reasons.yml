title: How a kind file names its reasons
question: How does a kind file say which decision or principle is behind a kind, its layers and each of its fields?
context: "Today the kind file of interface says it lives in software and nothing says why, so three reviews moved it back and forth. With a because key, interface.yml says layers: [product] and because: software/ontology/decision/interface-layer; a reviewer reads that decision instead of guessing. A kind or field with no reason lands on a list UNJUSTIFIED, which is the worklist of the judged-as-new test. It points at a decision, not a proposal: a proposal is the AI's suggestion inside a decision, and only the answer makes a reason. 29 kind files hold 96 fields; 4 comments name a decision today."
options:
  because-key:
    label: "A kind file gains `because`: addresses of decisions or principles in ogy's own knowledge base, for the kind, for `layers` and for a field. A test in ogy's repository reads them: each address exists, and a kind or field with none sits in a list UNJUSTIFIED with one line of why, as UNEXERCISED does today. A link only, no reason text; other repositories ignore the key"
  decision-names-kind:
    label: 'The other way: a decision gains a link to the kind or field it decides; a kind gets an address'
  kinds-as-entries:
    label: ogy's knowledge base describes each kind and field as an entry of its own with `because`
  comments:
    label: 'As today: comments in the kind file, read by no check'
  because-key-computed:
    label: 'As because-key, with no hand-kept list: kinds and fields without a because are printed by a command, and an answered decision in software/ontology that no kind file names is listed as work'
proposal:
  chose: because-key-computed
  why: 'A kind-file answer leaves no entry, so ogy work cannot list it; once a kind file names the decision behind it, an answered ontology decision no kind file names is computable (principles deterministic-first, earned-on-a-real-case). Before: because-key.'
