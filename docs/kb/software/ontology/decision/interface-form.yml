question: How does an interface say how it is reached?
context: 'Bead ogy-yy9.75: interface `as` became `form`, fingerprinted, not a note. A check reads it (a cli interface says invoked_as), so it is an enum.'
options:
  enum:
    label: A required enum form (web, cli, http, mcp, library, file, message); invoked_as kept, required when form is cli
  text:
    label: A free text form, a note
  enum-list:
    label: '`form` is a list of the same enum; an interface reached as a command and as an MCP tool says both, and the 18 ogy commands become cli and mcp'
proposal:
  chose: enum
  why: An interface is one point of reach in one form (borrow-cli and borrow-page are two); MCP tools are generated from the command table and one interface, mcp, serves them.
answers:
- chose: enum
