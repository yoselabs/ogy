title: Whether a delegated answer is a reason
question: Does an answer an agent gave under the owner's delegation count as a goal's reason?
context: "Built on 2026-11-26 (ogy-3nv): a goal's reason is a cited principle or an answered decision, and a delegated answer counts. The Fable review points out that capture-judgement lets an agent decide while reading a product from code, so code could become a reason with no person speaking; reason-is-owed heard: empty until someone gives one. Goals resting on a delegated answer today: 0."
options:
  person-only:
    label: "No: only the owner's own answer or a principle the owner agreed is a goal's reason"
  delegated-counts:
    label: 'Yes, as built: a delegated answer counts, and ogy dropped lists it for veto'
proposal:
  chose: delegated-counts
  why: "Fable, second read: a delegated answer already shows as 'AI, for you', waits as a card in ogy review and is listed by ogy dropped; a no-reason row too would list the same gap twice, and no agent could clear it. The reason stays empty unless the owner delegated it."
  heard: 'There are states: proposed by AI or by me, approved by AI or by me; an AI approval can later get my yes, and none of it should block work.'
answers:
- chose: delegated-counts
  said: "Ok to Fable's pick: a delegated answer counts; it waits as a card for my yes"
