title: What a context is
question: The owner answered that areas group into contexts. Is a context a field of an area, its own kind, or only something the viewer computes?
context: The answer contexts-above-areas created nothing. The word context is already avoided for area, used for a decision's field and for an enum in the viewing area.
options:
  area-field:
    label: A field of area naming its context, with a new word that is not context
  own-kind:
    label: A kind of its own that areas link to
  viewer-only:
    label: Nothing in the ontology; the board lets the owner group areas and keeps that outside the knowledge base
  defer:
    label: Nothing for now; decide when the board filters by it
  system-kind:
    label: 'A kind `system`: one thing the owner ships and names, with a sentence (`says`); areas of both layers link to it with a new field `area.system`; a system holds rules and cites principles'
  computed-until-second-system:
    label: 'Nothing stored now: which product areas a software area builds is computed from `performs`, `serves` and `offers` and printed with the area; a kind for what the owner ships is asked again when one knowledge base holds two shipped things that share no handler.'
  one-kb-each:
    label: Each shipped thing keeps its own knowledge base with both layers; another one reads its product interfaces as its dependencies. No kind for a shipped thing inside one knowledge base. Asked when a second knowledge base exists
proposal:
  chose: computed-until-second-system
  why: One shipped thing today; system-word and proportion-home propose no kind; the product-to-software link is computed from performs, serves and offers.
answers:
- chose: area-field
  said: "Follow Fable's recommendation: a field of area, with a new word that is not context."
  at: '2026-11-22T15:44:57+01:00'
  where: ai:claude/f6fcc5ed
  note: The word is still to be chosen.
- chose: computed-until-second-system
  said: Yes to all 9 of Fable's picks, read on the pet shop cards
