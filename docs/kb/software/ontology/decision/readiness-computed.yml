title: Whether an entry is ready or waiting
question: How does ogy know that a part of the product is not ready for design, for instance because a question about it waits for the owner or an AI decided it and nobody agreed?
context: 'The owner wants waiting parts marked and "no missing decisions" to be a fact one can read. Computed rule (M4): an entry waits when an unanswered decision names it in `sets` or is cited by its `because`, when `ogy status` classes it decided by AI or changed since agreed, or when one of its parts waits. Today the first reason marks nothing (0 questions) and the second marks 43 entries (37 decided by AI, 6 changed).'
options:
  computed:
    label: 'Computed from decisions and status, never stored: `ready` joins the computed names, `ogy work` lists a row owed for a waiting entry apart, `ogy status` counts ready per area'
  stored-mark:
    label: A field on each entry that a person or agent sets to ready or waiting
  none:
    label: No readiness; the owner reads `ogy status` and `ogy review`
  computed-unanswered-only:
    label: 'Computed, never stored, and no new name: an entry waits when its status is `question waiting`, or it cites an unanswered decision with `because`, or a part of it or an entry it links to waits. `ogy work <layer>` lists a row owed for a waiting entry apart, with the address waited on. Entries decided by AI or changed since agreed stay counted apart. A decision asked again does not make its entries wait.'
proposal:
  chose: computed-unanswered-only
  why: The mark already exists in show; unagreed entries are not missing decisions and status already owns that fact.
answers:
- chose: computed-unanswered-only
  said: "A on all eight of batch 1: readiness computed, stage filters, reverse links by field word, trace in a workflow's brief, the kind files the only owner of their lists, a ui scheme for the board, I don't know records nothing, kind files carry because"
