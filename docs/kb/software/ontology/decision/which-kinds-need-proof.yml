question: Which kinds need a proof?
context: 'Bead ogy-yy9.75, D15 (harmony finding 14): rows (choice, case, timeout), rule, interface, setting and workaround need a proof; an entity only while it has transitions, declared in YAML as needs_proof {if_part: transition}; not step, handler, quantity. One owner: Snapshot.needs_proof per entry, Kind.proves per kind. A built line on a live entry that needs no proof is removal work and ogy migrate deletes it. The handler uses pin input no longer counts; a dependency pin still reaches the rules it is held to (rule input_from satisfies pin). docs/kb work left 174 to 130; fixtures: the late-fee proof moved from the quantity to its rule.'
options:
  behaviour:
    label: Rows, rule, interface, setting, workaround; entity only with transitions; not step, handler, quantity
  rule-and-quantity:
    label: Only rule and quantity
  keep:
    label: Keep the 13 kinds
  behaviour-and-built-decisions:
    label: 'As behaviour, and an answered decision marked `structure` whose option in force sets nothing is work until it carries a `proof`: a test that reads the kind files and fails when they stop matching that answer; a new answer makes the proof out of date.'
  behaviour-rule-carries-it:
    label: 'As behaviour. A decision proves nothing by itself: when its answer must stay true in the code, its option sets a rule, and the rule needs the proof'
  entry-carries-it:
    label: 'As behaviour. A decision proves nothing by itself. When its answer changes what ogy does, its option sets the entry that states it: the interface, row or handler sentence it changes, or a rule when the statement spans several of them; that entry carries the proof. An answer that lives in a kind file is carried by that kind file citing the decision with because and proved by the tool-library fixture; no rule repeats it'
proposal:
  chose: entry-carries-it
  why: 'The answer in force says sets a rule, which clashes with the interface guidance (a rule only for more) and with rules-need-a-check (a rule that repeats a kind-file check goes); one fact, one owner (principles one-owner-per-fact, deterministic-first). Found by the work comparison of 2026-11-28: 31 answers moved 7 work items and 14 tasks were filed by hand. Before: behaviour-rule-carries-it.'
  at: '2026-11-28T02:46:16+01:00'
  heard: 'The flow is: add to the knowledge base, use ogy work, create tracker items; a task tied to nothing drifts.'
answers:
- chose: behaviour
  said: 'Yes, all: D15, proof on rows, rule, interface, setting, workaround; entity only with transitions; not step, handler, quantity'
  at: '2026-11-20T03:33:40+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
- chose: behaviour-rule-carries-it
  said: Good with the proof design
  at: '2026-11-27T20:08:40+01:00'
  where: ai:claude/ontology-review-session-749f16
- chose: entry-carries-it
  said: 'Yes: decision-named tasks close when a kind file cites the decision, and an answer that changes behaviour sets the entry that states it'
  at: '2026-11-28T02:58:03+01:00'
  where: ai:claude/ontology-review-session-749f16
