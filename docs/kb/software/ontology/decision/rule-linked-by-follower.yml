title: A rule is linked by what follows it
structure: true
question: Which file holds the link between a rule and the entry that follows it?
context: A reader of a rule asks where it is used; a reader of a step asks why it exists. Two copies of one link drift.
options:
  follower:
    label: Once, by the follower (`by`); `on` is dropped
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: A rule is linked once, by the entry that follows it (`by` on a case or a choice, as `because` names principles); a rule has no `on`. A rule and its first follower are written in one batch; a rule that nothing follows is an error; `show` and the area map print the link both ways.
  both:
    label: Both files hold the link
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: A rule names what it applies to with `on`, its follower names it with `by`, and check keeps the two in step.
guess:
  chose: follower
  why: One owner per link; show computes the other direction.
  heard:
    said: Probably A
answers:
- chose: follower
  note: tentative
  said: Probably A
  from: human
