title: A rule is linked by what follows it
structure: true
question: Which file holds the link between a rule and the entry that follows it?
context: 'A reader of a rule asks where it is used; a reader of a step asks why it exists. Two copies of one link drift. Today no entry names a rule with `by`, and eight kinds accept it (the in-force text lists seven: timeout is missing).'
options:
  follower:
    label: Once, by the follower (`by`); `on` is dropped
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: A rule is linked once, by the entry that follows it (`by` on a case or a choice, as `because` names principles); a rule has no `on`. A rule and its first follower are written in one batch; a rule that nothing follows is an error; `show` and the area map print the link both ways.
  both:
    label: Both files hold the link
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: A rule names what it applies to with `on`, its follower names it with `by`, and check keeps the two in step.
  held-to:
    label: '`by` means "is held to this rule", on cases, choices, externals, workflows, entities and attributes; `on` stays dropped'
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: "An entry names the rules it is held to with `by` (links to rules): a case, a choice, an external, a workflow, an entity or an attribute (an operation or a capability only when a real rule needs it), as `because` names principles. A rule has no `on`; a rule that nothing names with `by` is an error; `show` and the area map print `by` both ways; a change to an external's pin makes the proofs of the rules it is held to suspect."
  by-everywhere:
    label: '`by` on cases, choices, externals, workflows, entities, attributes and guards; rule `on` dropped; each kind sets whether `by` counts in its fingerprint'
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: "An entry names the rules it is held to with `by` (links to rules): a case, a choice, an external, a workflow, an entity, an attribute or a guard, as `because` names principles. A rule has no `on`. Each kind sets whether `by` counts in its fingerprint, so adding a rule never stales a holder's agreement (a row keeps it in); `show` prints `by` both ways; a change to an external's pin makes the proofs of the rules it is held to suspect."
  declared:
    label: Behaviour entries name their rules with `satisfies`, a rule names the data it constrains; the kind files say which kinds take each
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: A behaviour entry (a step, a row, an interface, a handler, a dependency or a workflow) names the rules it is held to with `satisfies`; a rule names the data it constrains with `constrains`; a rule has no `on`; the kind files say which kinds take each.
  declared-and-used:
    label: As the one before, and a rule that nothing names with `by` is an error
    sets:
      software/ontology/rule/rule-is-linked-by-its-follower:
        says: An entry names the rules it is held to with `by`; a rule has no `on`; the kind files say which kinds take `by`; a rule that nothing names with `by` is an error.
proposal:
  chose: follower
  why: One owner per link; show computes the other direction.
  heard: Probably A
answers:
- chose: follower
  note: tentative
  said: Probably A
  at: '2026-11-18T19:37:15+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
- chose: held-to
  said: "Accept Fable's pick: entries name the rules they are held to with by, including stores, workflows, entities and attributes."
  at: '2026-11-18T22:08:21+01:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
- chose: by-everywhere
  said: Drop rule on; by everywhere; per-kind fingerprint choice.
