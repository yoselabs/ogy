says: 'No new kinds for environments, permissions or SLOs and no data fields yet. First one real SLO and one real permission are written with the existing kinds (value, rule, guard), a Postgres to DynamoDB store change runs as a diff test on a small example kb, and two text guards are added: a sentence naming an entry must be a link, and a rule that constrains nothing is an error. A field is added only where a check could not read what it needed.'
