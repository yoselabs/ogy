says: "An entry names the rules it is held to with `by` (links to rules): a case, a choice, an external, a workflow, an entity or an attribute (an operation or a capability only when a real rule needs it), as `because` names principles. A rule has no `on`; a rule that nothing names with `by` is an error; `show` and the area map print `by` both ways; a change to an external's pin makes the proofs of the rules it is held to suspect."
