says: "The fix-now items of the ontology review are built in this order: 1 a migration rule for kind changes; 2 an example knowledge base run as a regression fixture on every kind change; 3 a field-reader report; 4 the actor nature system, with step.actor naming actors only; 5 layer-root homes and a glossary per area; 6 rule.on dropped for `by` on externals, workflows, entities, attributes and guards; 7 conditional requirements (if_equals, needs_field) and choice.when; 8 external.terms, effect.value, config_key.used_by and config_key.default cut; 9 guess.value renamed to sets; 10 terms compressed, moving distinct into says and avoid first; 11 a guidance field per kind and `ogy kinds --map`, with guidance on because against by; 12 the environment example of docs/guidance.md fixed. Items 4, 5, 6 and 9 change the structure and wait for the owner's card; keep and park items get a bead each group."
