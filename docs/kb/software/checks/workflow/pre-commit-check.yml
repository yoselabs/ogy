says: A commit that changes the knowledge base is made only when ogy check passes on the staged tree.
src:
- code:src/ogy/init.py#HOOK
start: commit
steps:
  commit:
    says: Git starts a commit of a person or an agent and runs the hook.
    actor: software/checks/actor/committer
    choices:
      commit:
        label: Commit
        then: skip
    agreed:
      at: '2026-11-19T18:56:21+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: Agreed to the seven review, init and hook sentences, with the reply step reworded to a paraphrase
      hash: 251acf4754cf
  check:
    says: The hook writes the staged tree as a commit and runs the shared check on it.
    calls: product/checks/workflow/check
    cases:
      clean:
        covers_ends:
        - product/checks/workflow/check/end/clean
        then: committed
      blocked:
        covers_ends:
        - product/checks/workflow/check/end/blocked
        then: refused
  skip:
    says: A commit that changes nothing under docs/kb is not checked.
    cases:
      untouched:
        order: 1
        when:
          text: the commit changes nothing under docs/kb
        then: committed
      otherwise:
        then: check
ends:
  committed:
    result: success
    says: The commit is made.
    agreed:
      at: '2026-11-19T18:56:21+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: Agreed to the seven review, init and hook sentences, with the reply step reworded to a paraphrase
      hash: 5bb66c99d080
  refused:
    result: failure
    says: The commit is refused and the findings are printed.
