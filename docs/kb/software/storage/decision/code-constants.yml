question: Which numbers that nothing links to stay values in the knowledge base?
context: 'Fable review 2026-11-19: seven values link to nothing; three are knobs a person may tune, four are lengths and a format the code owns.'
options:
  knobs-only:
    label: Keep rounds-kept, history-limit and near-addresses; cut the four code constants
    sets:
      software/storage/value/fingerprint-length:
      software/storage/value/source-hash-length:
      software/storage/value/round-digest-length:
      software/storage/value/removed-ledger-format:
  keep-all:
    label: Keep all seven
    sets:
      software/storage/value/fingerprint-length:
        is: 12
      software/storage/value/source-hash-length:
        is: 12
      software/storage/value/round-digest-length:
        is: 6
      software/storage/value/removed-ledger-format:
        is: 1
guess:
  chose: keep-all
  why: Kept until the owner answers.
