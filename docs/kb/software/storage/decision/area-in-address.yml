title: The area stays in the address
question: Does an address keep its area?
context: Dropping the area would make an id unique per layer and stop a move from changing addresses.
options:
  keep:
    label: 'Keep: <layer>/<area>/<kind>/<id>'
    sets:
      software/storage/rule/address-keeps-the-area:
        says: 'Every address names its area: <layer>/<area>/<kind>/<id>; a part adds its kind and key.'
  drop:
    label: 'Drop the area: <layer>/<kind>/<id>'
    sets:
      software/storage/rule/address-keeps-the-area:
        says: 'An address has no area: <layer>/<kind>/<id>; an id is unique within its layer.'
proposal:
  chose: keep
  why: The area is how a reader finds an entry and how files are laid out; the owner calls it a must.
  heard: The area must stay in the address
answers:
- chose: keep
  said: The area must stay in the address
