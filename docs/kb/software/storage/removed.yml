- id: software/storage/decision/topic-areas
  kind: decision
  parent:
  title: The topic areas of ogy's own knowledge base
  said: ogy's knowledge base has one area per layer named after the product (ogy), which check warns about. Which areas do new entries go to?
  why: 'Fable review 2026-11-19, owner took all recommended: repeats a kind file, a term or the tree'
  replaced_by:
  at: 2026-11-19 16:50:14+00:00
  last_seen: 161e464e57d7c52334f78714456646e77fb1d989
  hash: d000b35e6b2b
  ontology: software
  snapshot:
    title: The topic areas of ogy's own knowledge base
    structure: true
    question: ogy's knowledge base has one area per layer named after the product (ogy), which check warns about. Which areas do new entries go to?
    context: Asked by the owner on 2026-11-18 (split the area by topic, both layers). Names chosen by the agent; existing entries cannot move yet (see software/storage/decision/moving-entries).
    answers:
    - chose: by-topic-extended
      said: Yes, record the topic areas
      from: human
      at: '2026-11-18T11:32:15+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    - chose: folders-are-the-list
      said: 'Fable: the area list is stale; the tree is the list'
      from: ai
      at: '2026-11-19T00:31:25+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      delegated: software/ontology/decision/review-delegation
    - chose: folders-are-the-list
      said: Took every recommendation of Fable's revised round
      from: human
      at: '2026-11-19T17:49:58+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
    guess:
      chose: by-topic
      why: Each area then matches one workflow or one part of the code, so review --from code pages one topic at a time; two wide areas would only rename ogy.
    options:
      by-topic:
        label: 'product: capture, review, removal, checks, setup, inspection, evals, terms; software: cli, mcp, writes, storage, checks, setup'
        sets:
          software/storage/rule/areas-by-topic:
            says: "ogy's own knowledge base groups entries by topic. product: capture, review, removal, checks, setup, inspection, evals, terms. software: cli, mcp, writes, storage, checks, setup. No area is named after the product."
      by-kind-of-work:
        label: 'Fewer, wider areas: product/requirements and software/implementation'
        sets:
          software/storage/rule/areas-by-topic:
            says: "ogy's own knowledge base has one wide area per layer: product/requirements and software/implementation."
      by-topic-extended:
        label: by-topic, plus product/people, product/ontology, software/ontology, software/packaging; product/terms is named product/language
        sets:
          software/storage/rule/areas-by-topic:
            says: "ogy's own knowledge base groups entries by topic. product: capture, review, removal, checks, setup, inspection, evals, language, ontology, people. software: cli, mcp, writes, storage, checks, setup, ontology, packaging. No area is named after the product."
      folders-are-the-list:
        label: No rule lists the areas; the folders of the tree are the list
        sets:
          software/storage/rule/areas-by-topic:
- id: software/storage/entity/write-lock
  kind: entity
  parent:
  title:
  said: The file ogy.lock in the Git directory that one ogy write holds at a time.
  why: 'Fable review 2026-11-19: restates writes.py#locked; the guard write-lock-free holds the rule'
  replaced_by:
  at: 2026-11-19 18:01:16+00:00
  last_seen: 0ce1c89878094f39551e6da242aa4d36e7058a95
  hash: e8a1e5e522a2
  ontology: software
  snapshot:
    says: The file ogy.lock in the Git directory that one ogy write holds at a time.
    src:
    - code:src/ogy/writes.py#locked
    states:
      free:
        says: No write holds the lock.
      held:
        says: One write holds it; another write is refused.
    transitions:
      acquire:
        from:
        - free
        to: held
      release:
        from:
        - held
        to: free
