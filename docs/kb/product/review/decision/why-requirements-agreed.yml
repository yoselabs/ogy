title: 'Why: requirements-agreed'
question: Why must every requirement name its source and wait for the owner's yes?
context: "Pain (proposed by AI, 2026-11-26; the goal was read from ogy's own code or docs and had no reason, decision reason-is-owed): Requirements written by AI looked decided though no person had agreed to them, so nobody could tell a choice from a guess."
options:
  this-pain:
    label: 'Yes, that is the pain: keep the goal'
    sets:
      product/review/goal/requirements-agreed:
        says: Every requirement of a product is an entry that names where it came from, and the owner has agreed to it or can still answer it.
  drop:
    label: Not a goal of ogy
    sets:
      product/review/goal/requirements-agreed:
proposal:
  chose: this-pain
  why: A guess from what the code does; the owner's words replace it.
