title: A card says what its sentence rests on
question: Does a review card print where its sentence came from, what it rests on and who agreed?
context: 'Found by the audit of 2026-11-28 (friction ledger, 29 items; independent review agreed). The evidence line prints Decided by AI: nothing you said supports it even when the entry cites an answered decision with because (13 of 19 AI-written cards in round rea07bb; ledger item 28).'
