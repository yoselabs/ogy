says: The agent shows the owner a round of cards and applies the owner's reply to it.
src:
- code:src/ogy/reply.py#reply
realizes:
- product/review/capability/apply-a-reply
start: show
steps:
  show:
    says: The agent runs ogy review; the round is saved and its id printed.
    actor: product/shared/actor/agent
    choices:
      shown:
        label: Show the round
        then: reply
        effects:
        - do: create
          on: product/review/entity/review-round
    agreed:
      at: '2026-11-20T20:52:40+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to what Fable judged true against the code'
      hash: 86a1a87ac257
  reply:
    says: The owner replies in the reply grammar, or in natural words that the agent reads as its items and records with a short paraphrase; a reading of what the owner said (You said ..., read as B) is confirmed only by its own letter, never by a bare yes.
    actor: product/shared/actor/owner
    choices:
      replied:
        label: Reply
        then: apply
      dont-know:
        label: I do not know
        then: show
    agreed:
      at: '2026-11-28T06:13:33+01:00'
      where: ai:claude/ontology-review-session-749f16
      said: "A on all eight of the audit's first batch: readings need their own letter, put dry run, the two decisions move to product, cards say what they rest on, a refused AI entry stops being built, contexts link entries, kind lines name their option, removals wait for the answer"
      hash: a6ed4e776ae6
  apply:
    says: ogy applies each item of the reply to the round, each on its own.
    cases:
      changed:
        order: 1
        when:
          text: the entry of the card changed since the round was shown
          reads:
          - product/capture/entity/entry
        then: refused
      otherwise:
        then: applied
        effects:
        - do: move
          on: product/capture/entity/entry/transition/agree
      bare-yes-on-all:
        order: 0
        when:
          text: the round was shown with --all and the yes names no cards
          reads:
          - product/review/entity/review-round/attribute/everything
        then: refused
    agreed:
      at: '2026-11-20T20:52:40+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to what Fable judged true against the code'
      hash: e614c30ddca9
ends:
  applied:
    result: success
    says: Each item is applied to its card, and what it records carries a short paraphrase of what the owner said.
    agreed:
      at: '2026-11-19T19:50:03+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: "Owner delegated round rc461c4 to Fable: agreed to the seven, with init's ends, the remove check and the reply end reworded"
      hash: 84d2f41c5f42
  refused:
    result: failure
    says: The item is refused and its card stays in the queue.
    agreed:
      at: '2026-11-19T18:56:21+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: Agreed to the seven review, init and hook sentences, with the reply step reworded to a paraphrase
      hash: 444ebcb4d84e
