- id: requirements-agreed
  says: Every requirement of a product is an entry that names where it came from, and the owner has agreed to it or can still answer it.
  for:
  - product/shared/actor/owner
  src:
  - code:src/ogy/status.py#status
  because:
  - product/review/pain/guesses-look-decided
- id: fewest-questions
  says: The owner is asked only what the sources do not answer, a few cards at a time, each with a recommended answer.
  for:
  - product/shared/actor/owner
  src:
  - code:src/ogy/status.py#queue
  because:
  - product/review/pain/flooded-with-questions
  - product/review/pain/question-not-alone
