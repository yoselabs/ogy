    snapshot:
      says: A bare yes to a round shown with --all is refused; the owner names the cards or says yes all.
      on: product/review/workflow/review-and-reply/step/apply
      when:
        text: the round was not shown with --all, or the yes names its cards
        reads:
        - product/review/entity/review-round/attr/everything
      else: product/review/workflow/review-and-reply/end/refused
