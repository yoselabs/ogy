      question: Why ask the owner only what the sources do not answer, a few cards at a time?
      context: "Pain (proposed by AI, 2026-11-26; the goal was read from ogy's own code or docs and had no reason, decision reason-is-owed): The owner was flooded with questions, many already answered by the code or the docs, and long lists went unanswered."
