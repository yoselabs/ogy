        this-pain:
          label: 'Yes, that is the pain: keep the goal'
          sets:
            product/review/goal/fewest-questions:
              says: The owner is asked only what the sources do not answer, a few cards at a time, each with a recommended answer.
        drop:
          label: Not a goal of ogy
          sets:
            product/review/goal/fewest-questions:
      proposal:
        chose: this-pain
        why: A guess from what the code does; the owner's words replace it.
