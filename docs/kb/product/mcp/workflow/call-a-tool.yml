says: An MCP client calls an ogy tool and gets what the same CLI command returns.
src:
- code:src/ogy/mcp_server.py#_run
start: call
steps:
  call:
    says: The client calls a tool with the command's arguments, and every tool also takes --repo, --rev and --ontology.
    actor: product/mcp/actor/mcp-client
    choices:
      call:
        label: Call the tool
        then: run
    agreed:
      at: '2026-11-19T19:00:55+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: Owner delegated this round to Fable's judgment; Fable approved 1, 6 and 7 and reworded 2 and 3
      hash: 8a1b112cde34
  run:
    says: ogy runs the CLI command inside the MCP server's process and returns tables and records for an agent.
    cases:
      error:
        order: 1
        when:
          text: the command ends with a usage error, a refusal or not found (exit 2 to 4)
          reads:
          - product/mcp/enum/exit-codes
        then: tool-error
      otherwise:
        then: result
      unnamed-round:
        order: 0
        when:
          text: the tool is reply and names no round with --round
          reads:
          - product/review/entity/review-round
        then: tool-error
    agreed:
      at: '2026-11-20T20:52:40+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to what Fable judged true against the code'
      hash: e1900bf7d62b
ends:
  result:
    result: success
    says: The client gets the exit code and the output.
    agreed:
      at: '2026-11-19T20:32:47+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to the round Fable judged true against the code'
      hash: 4d05d09f89ea
  tool-error:
    result: failure
    says: The client gets a tool error with the reason.
    agreed:
      at: '2026-11-19T19:00:55+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: Owner delegated this round to Fable's judgment; Fable approved 1, 6 and 7 and reworded 2 and 3
      hash: 4a70b6c2543d
realizes:
- product/mcp/capability/tools-over-mcp
agreed:
  at: '2026-11-27T20:07:49+01:00'
  where: ai:claude/ontology-review-session-749f16
  said: Yes, every ogy command as an MCP tool makes sense, as long as it is tied to the pains and goals behind it
  hash: ae250e7c08b9
