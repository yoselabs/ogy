question: How does ogy keep what the owner said?
context: A yes at the read-back and an answer need who, when and where. Storing a person's words verbatim keeps text that some people would hate to see logged, even as a quote.
options:
  messages:
    label: Every reply is stored whole and once as a message, never edited, and cited by answers and agreements
    sets:
      product/capture/rule/reply-is-a-message:
        says: Every reply of the owner is stored whole and once as a message and is never edited.
      product/capture/rule/no-stored-words:
      software/writes/rule/agreement-lives-on-the-entry:
      product/capture/capability/store-words:
        says: The owner's words are stored verbatim as a message when they are said, and answers and agreements cite that message.
        src:
        - code:src/ogy/writes.py#message
      software/writes/handler/store-message:
        says: Stores a message under its actor's area with an id made of the date and a digest of who, when, where and the words.
      software/cli/command/message:
        says: Store a reply of a person or an agent, whole and once.
      software/storage/quantity/message-digest-length:
        says: The length of the digest in a message's id, after its date.
      software/writes/handler/record-answer:
  paraphrase:
    label: 'No messages or quotes: an answer and an agreement keep a short paraphrase, who, when and where'
    sets:
      product/capture/rule/reply-is-a-message:
      product/capture/rule/no-stored-words:
        says: "ogy stores no messages and no quotes: an answer keeps the option chosen, a short paraphrase of what the person said (said), when (at) and where (the session); an agent's answer names the decision that let it decide (delegated)."
      software/writes/rule/agreement-lives-on-the-entry:
        says: "A person's yes in a review round is kept on the entry it agrees to (agreed: at, where, said and the fingerprint agreed to); only a person agrees, and only reply writes it."
      product/capture/capability/store-words:
        says: When the owner speaks, the agent records the answer at once with a short paraphrase of what they said, and shows that paraphrase to the owner in the read-back.
        src:
        - code:src/ogy/writes.py#said
      software/writes/handler/store-message:
      software/cli/command/message:
      software/storage/quantity/message-digest-length:
      software/writes/handler/record-answer:
        says: 'Appends an answer to its decision: the option chosen, a short paraphrase of what was said, who, when and where.'
        performs:
        - product/capture/workflow/store-owner-words/step/keep/case/otherwise
        uses:
        - software/storage/dependency/git
        src:
        - code:src/ogy/writes.py#answer
proposal:
  chose: paraphrase
  why: The owner chose it on 2026-11-18, for privacy.
answers:
- chose: messages
  said: Every reply is stored as a message
  at: '2026-11-17T18:00:15.375+00:00'
  where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157#6359
- chose: paraphrase
