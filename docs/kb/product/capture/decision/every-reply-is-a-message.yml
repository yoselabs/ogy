question: How does ogy keep what the owner said?
context: A yes at the read-back and an answer need who, when and where. Storing a person's words verbatim keeps text that some people would hate to see logged, even as a quote.
options:
  messages:
    label: Every reply is stored whole and once as a message, never edited, and cited by answers and agreements
    sets:
      product/capture/rule/reply-is-a-message:
        says: Every reply of the owner is stored whole and once as a message and is never edited.
      product/capture/rule/no-stored-words:
      software/writes/rule/agreement-lives-on-the-entry:
      product/capture/capability/store-words:
        says: The owner's words are stored verbatim as a message when they are said, and answers and agreements cite that message.
        src:
        - code:src/ogy/writes.py#message
      software/writes/operation/store-message:
        says: Stores a message under its actor's area with an id made of the date and a digest of who, when, where and the words.
      software/cli/command/message:
        says: Store a reply of a person or an agent, whole and once.
      software/storage/value/message-digest-length:
        says: The length of the digest in a message's id, after its date.
      software/writes/operation/record-answer:
      product/shared/term/message:
        says: One reply of a person or an agent, stored whole and once, never edited; the only kind that entries may cite as a source and that can agree.
      product/shared/term/answer:
        says: The owner's choice of one option of a decision, kept with its message and a quote; the one whose message is newest is in force.
      product/shared/term/agreement:
        says: A message that says yes to the sentences now on entries, recorded as the shown text and the fingerprint; whether an entry is decided by you, decided by AI or changed since you agreed is computed from it.
      product/shared/term/src:
        says: 'The place a sentence came from: a message, a code: link or a doc: link, and nothing else.'
      product/shared/term/owner:
        says: The person who decides the business questions of the product; an agent relays the owner's words verbatim and never answers or agrees for them.
  paraphrase:
    label: 'No messages or quotes: an answer and an agreement keep a short paraphrase, who, when and where'
    sets:
      product/capture/rule/reply-is-a-message:
      product/capture/rule/no-stored-words:
        says: 'ogy stores no messages and no quotes: an answer keeps the option chosen, a short paraphrase of what the person said (said), who (from: human or ai), when (at) and where (the session).'
      software/writes/rule/agreement-lives-on-the-entry:
        says: "A person's yes in a review round is kept on the entry it agrees to (agreed: at, where, from human, said and the fingerprint agreed to); only a person agrees, and only reply writes it."
      product/capture/capability/store-words:
        says: When the owner speaks, the agent records the answer at once with a short paraphrase of what they said, and shows that paraphrase to the owner in the read-back.
        src:
        - code:src/ogy/writes.py#said
      software/writes/operation/store-message:
      software/cli/command/message:
      software/storage/value/message-digest-length:
      software/writes/operation/record-answer:
        says: 'Appends an answer to its decision: the option chosen, a short paraphrase of what was said, who, when and where.'
        performs:
        - product/capture/workflow/store-owner-words/step/keep/case/otherwise
        uses:
        - software/storage/external/git
        src:
        - code:src/ogy/writes.py#answer
      product/shared/term/message:
      product/shared/term/answer:
        says: Option chosen by the owner or delegated agent, paraphrased, never quoted; not a guess.
      product/shared/term/agreement:
        says: A person's yes to a sentence's fingerprint, whoever proposed it; status computed, never stored.
      product/shared/term/src:
        says: "A sentence's code: or doc: link; not authority, not a decision, outside the fingerprint."
      product/shared/term/owner:
        says: The person deciding business questions; an agent only paraphrases them, never answers for them.
guess:
  chose: paraphrase
  why: The owner chose it on 2026-11-18, for privacy.
