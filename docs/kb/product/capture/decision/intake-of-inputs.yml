title: Raw inputs and where they live
question: When the owner gives a long input (a call transcript, a document), where does it live and how does an entry point to the passage it came from?
context: "`src` takes `doc:<commit>:<path>#<anchor>`, which is a Markdown heading at the finest; a transcript has no headings. The KB keeps no quotes and no messages. Option inputs-folder: raw inputs live in the repository outside the KB, as `owner-inputs.md` does, and `evidence.doc` accepts a section or a line range (`#L10-L14`), with the pinned commit keeping lines stable; \"new from this input\" is every entry whose `src` names that file. Only the person at the desk answers: a stakeholder's sentence is an input."
options:
  inputs-folder:
    label: An inputs folder in the repository, cited by `doc:` with a section or a line range
  input-kind:
    label: A kind `input` in the KB that holds each input
  outside-git:
    label: Inputs stay outside Git; entries keep only a paraphrase
  inputs-folder-headings:
    label: Raw inputs stay in the repository outside the KB, one dated heading per input, cited by `doc:` with that heading; a finer pointer (line range, other file types) waits for the first input that has lines and no headings.
proposal:
  chose: inputs-folder-headings
  why: The only real input has one line per heading, so a line range is no finer than the heading anchor (L5).
