says: A term, an actor or a set that one area uses lives in that area; one that two areas use lives in the reserved area `shared` of its layer (product/shared/actors.yml, product/shared/glossary.yml), so every address keeps its area; an entry with behaviour or a decision stays in its owning area and others link to it; ogy check enforces it.
