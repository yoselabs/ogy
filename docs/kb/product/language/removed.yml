    snapshot:
      title: What an area is now
      question: The term area still gives glossary and ogy as its examples; an area is now the folder under a layer, named by topic. Which wording does the glossary keep?
      context: ogy check reports an area named like the product as a finding (src/ogy/coverage.py product_areas); the glossary is a fixed folder, not an area under a layer.
      answers:
      - chose: fable-wording
        said: Yes, record the proposed wording
        from: human
        at: '2026-11-18T11:32:15+01:00'
        where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      guess:
        chose: fable-wording
        why: The owner chose this on 2026-11-18.
      options:
        topic-folder:
          label: The folder under a layer that groups entries by topic
          sets:
            product/shared/term/area:
              says: The folder under a layer that groups entries by topic, such as product/review or software/cli; it is named after a topic, never after the product.
        keep:
          label: 'Keep: one path segment, such as glossary or ogy'
          sets:
            product/shared/term/area:
              says: One path segment of an address that groups entries into one folder of the knowledge base, such as glossary or ogy.
        fable-wording:
          label: The folder under a layer that groups entries by topic, never named after the product
          sets:
            product/shared/term/area:
              says: A topic folder in one layer, never named like the product; not a kind.
