    ontology: software
    snapshot:
      title: What an address looks like now
      question: The term address still says area/kind/id; an address is now <layer>/<area>/<kind>/<id>, and a term is glossary/term/<id> with no layer. Which wording does the glossary keep?
      context: The loader parses <layer>/<area>/<kind>/<id> (src/ogy/model.py parse_address); the term was agreed on 2026-11-17.
      answers:
      - chose: fable-wording
        said: Yes, record the proposed wording
        from: human
        at: '2026-11-18T11:32:15+01:00'
        where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      guess:
        chose: fable-wording
        why: The owner chose this on 2026-11-18.
        heard:
          said: No skipping the product layer to put an area or kind on top
      options:
        with-layer:
          label: <layer>/<area>/<kind>/<id>; a term is glossary/term/<id>
          sets:
            product/shared/term/address:
              says: 'The path that names an entry: <layer>/<area>/<kind>/<id>, as in product/review/workflow/review-and-reply; a part continues it with its own kind and key (.../step/apply); a term is glossary/term/<id>, with no layer.'
        area-first:
          label: 'Keep: area/kind/id'
          sets:
            product/shared/term/address:
              says: 'The path that names an entry: area/kind/id; a part continues it with its own kind and key, as in ogy/decision/x/option/y.'
        fable-wording:
          label: The name of an entry, <layer>/<area>/<kind>/<id>; a part adds its kind and key; a term has no layer or area
          sets:
            product/shared/term/address:
              says: An entry's name, <layer>/<area>/<kind>/<id>, not its file path; links hold one.
