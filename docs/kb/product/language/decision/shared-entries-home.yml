question: 'Terms already have a home rule (product/language/decision/glossary-per-layer). Does the same hold for every shared thing, a term or an actor: where does it live, and who enforces it?'
structure: true
options:
  a:
    label: 'One area uses it: it lives in that area; two use it: it lives at the layer root; ogy check enforces it'
    sets:
      product/language/rule/shared-entries-home:
        says: A shared entry (a term, an actor) that one area uses lives in that area; one that two areas use lives at its layer's root; ogy check enforces it.
  b:
    label: Only terms follow the home rule; an actor lives wherever it was first written
    sets:
      product/language/rule/shared-entries-home:
  c:
    label: Only terms, actors and sets follow the home rule; an entry with behaviour or a decision stays in its owning area and is linked
    sets:
      product/language/rule/shared-entries-home:
        says: A term, an actor or a set that one area uses lives in that area; one that two areas use lives at its layer's root; an entry with behaviour or a decision stays in its owning area and others link to it; ogy check enforces it.
  shared-area:
    label: A reserved area `shared` in each layer holds the terms, actors and sets two areas use; every address keeps its area
    sets:
      product/language/rule/shared-entries-home:
        says: A term, an actor or a set that one area uses lives in that area; one that two areas use lives in the reserved area `shared` of its layer (product/shared/actors.yml, product/shared/glossary.yml), so every address keeps its area; an entry with behaviour or a decision stays in its owning area and others link to it; ogy check enforces it.
proposal:
  chose: c
  why: Words, actors and sets are shared vocabulary; an entry with behaviour or a decision has one owning area, and moving it would split it from its area's flow.
  heard: Recommended option fine.
