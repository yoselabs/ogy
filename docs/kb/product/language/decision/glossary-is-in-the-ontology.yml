question: Is the glossary part of the ontology?
context: 'The owner sees the glossary as close to a constitution: one fixed language that agents reuse.'
options:
  kind:
    label: Yes, the `term` kind in one global list
    sets:
      product/language/rule/glossary-is-an-ontology-kind:
        says: The glossary is the term kind of the ontology, one global list that the owner must agree to.
  document:
    label: No, a document beside it
    sets:
      product/language/rule/glossary-is-an-ontology-kind:
        says: The glossary is a document beside the ontology.
  kind-per-area:
    label: The term kind of the ontology, a glossary per area
    sets:
      product/language/rule/glossary-is-an-ontology-kind:
        says: The glossary is the term kind of the ontology, a list per area and one per layer root for shared terms; the owner must agree to each term.
  term-kind:
    label: The term kind of the ontology, agreed term by term; where the terms live is the layout's
    sets:
      product/language/rule/glossary-is-an-ontology-kind:
        says: The glossary is the term kind of the ontology; the owner must agree to each term.
guess:
  chose: kind-per-area
  why: The glossary stays a kind of the ontology; only its home changes to one per area.
  heard:
    said: Glossaries one to one with an area
