- id: set-up-a-repository
  says: A person sets a repository up for ogy once with ogy init; running it again repairs what is missing and overwrites nothing.
  src:
  - code:src/ogy/init.py#init
- id: doctor
  says: ogy init --check says what is not set up, one line each with how to mend it, and writes nothing.
  src:
  - code:src/ogy/init.py#doctor
