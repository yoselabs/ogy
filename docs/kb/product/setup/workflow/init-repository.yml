says: A person makes a repository ready for ogy.
src:
- code:src/ogy/init.py#init
trigger: actor
realizes: product/setup/capability/set-up-a-repository
start: run
steps:
  run:
    says: A person runs ogy init, or ogy init --check to only ask what is missing.
    actor: product/shared/actor/owner
    choices:
      init:
        label: Set up
        then: write
      ask:
        label: Ask what is missing
        then: report
    agreed:
      at: '2026-11-19T18:56:21+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: Agreed to the seven review, init and hook sentences, with the reply step reworded to a paraphrase
      hash: 29f093721057
  write:
    says: ogy writes each missing piece and merges into the files that exist.
    cases:
      unreadable:
        order: 1
        when:
          text: .mcp.json or .claude/settings.json cannot be read, or the flags contradict ogy.yml
        then: refused
      otherwise:
        then: set-up
        effects:
        - do: write
          on: software/setup/external/claude-code
        - do: write
          on: software/storage/external/git
    agreed:
      at: '2026-11-19T19:50:03+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: "Owner delegated round rc461c4 to Fable: agreed to the seven, with init's ends, the remove check and the reply end reworded"
      hash: d5ff27d8e918
  report:
    says: ogy lists what is not set up and writes nothing.
    then: reported
    agreed:
      at: '2026-11-19T19:50:03+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: "Owner delegated round rc461c4 to Fable: agreed to the seven, with init's ends, the remove check and the reply end reworded"
      hash: 6fa2ddbd04b6
ends:
  set-up:
    result: success
    says: ogy.yml, the constitution file, the shared area of the first layer, the ogy block in AGENTS.md (and in CLAUDE.md when it exists), the ogy server in .mcp.json, the deny rules and the pre-commit hook are in place.
    agreed:
      at: '2026-11-19T19:50:03+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: "Owner delegated round rc461c4 to Fable: agreed to the seven, with init's ends, the remove check and the reply end reworded"
      hash: c0802d4f3226
  reported:
    result: success
    says: The person reads what is missing, and the exit code is 1 when something is.
    agreed:
      at: '2026-11-19T19:50:03+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: "Owner delegated round rc461c4 to Fable: agreed to the seven, with init's ends, the remove check and the reply end reworded"
      hash: 116f80780dbf
  refused:
    result: failure
    says: Nothing is written; the refusal names the file or flag at fault.
    agreed:
      at: '2026-11-19T19:50:03+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: "Owner delegated round rc461c4 to Fable: agreed to the seven, with init's ends, the remove check and the reply end reworded"
      hash: f744cdb88480
