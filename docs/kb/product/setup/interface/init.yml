says: Set the repository up, or with --check say what is not set up; it is no MCP tool.
invoked_as: ogy init [--ontology <name>] [--land <branch>] [--check]
serves:
- product/setup/workflow/init-repository/step/run
src:
- code:src/ogy/cli.py#_writes
form: cli
inputs:
  name:
    says: The ontology the repository starts from.
    optional: true
  branch:
    says: The branch a change lands on.
    optional: true
