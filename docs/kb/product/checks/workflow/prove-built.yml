says: An agent or CI runs the tests with the stamping plugin, and the entries whose proofs passed are built.
src:
- code:src/ogy/stamping.py#stamp_passed
realizes: product/checks/capability/test-run-writes-built
start: run
steps:
  run:
    says: The agent runs the tests with --ogy-stamp (just stamp here); ogy writes the built line of every entry that needs a proof and whose every proof item passed, and leaves any other entry as it was.
    actor: product/shared/actor/agent
    choices:
      run:
        label: Run the tests
        then: built
        proof:
        - tests/test_stamping.py::test_the_run_writes_a_line_only_for_an_entry_whose_proofs_all_passed
        - tests/test_stamping.py::test_a_run_without_the_flag_writes_nothing_and_a_partial_run_keeps_the_lines
        - tests/test_stamping.py::test_a_proof_that_fails_deletes_the_line_of_its_entry
ends:
  built:
    result: success
    says: The entries whose proofs passed have their built lines; ogy work no longer lists them.
