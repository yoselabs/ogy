says: 'Every commit is made only when ogy check passes on the staged tree: a code rename can break a code: source without a knowledge-base change.'
src:
- code:src/ogy/init.py#HOOK
start: commit
steps:
  commit:
    says: Git starts a commit of a person or an agent and runs the hook.
    actor: product/checks/actor/committer
    choices:
      commit:
        label: Commit
        then: check
    agreed:
      at: '2026-11-20T20:52:40+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: 'Owner delegated to Fable: agreed to what Fable judged true against the code'
      hash: b5bbf3cec2d4
  check:
    says: The hook writes the staged tree as a commit and runs the shared check on it.
    calls: product/checks/workflow/check
    cases:
      clean:
        covers_ends:
        - product/checks/workflow/check/end/clean
        then: committed
      blocked:
        covers_ends:
        - product/checks/workflow/check/end/blocked
        then: refused
    agreed:
      at: '2026-11-19T20:32:47+01:00'
