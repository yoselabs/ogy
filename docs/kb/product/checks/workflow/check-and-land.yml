says: An agent or CI checks the knowledge base before it hands over or lands.
src:
- code:src/ogy/ops.py#run_check
trigger: actor
realizes: product/checks/capability/check-a-land
start: run
steps:
  run:
    says: The agent runs ogy check, CI runs ogy check --base against main, and --landing is added before a land.
    actor: product/shared/actor/agent
    choices:
      run:
        label: Check
        then: judge
    agreed:
      at: '2026-11-19T18:43:39+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      from: human
      said: Agreed to the seven, with CI's check sentence and the answered state corrected
      hash: 7109afc8929b
  judge:
    says: ogy checks the commit or the worktree it was pointed at.
    cases:
      findings:
        order: 1
        when:
          text: the check reports a finding
        then: blocked
      otherwise:
        then: clean
ends:
  clean:
    result: success
    says: No finding; the knowledge base may be handed over or landed.
  blocked:
    result: failure
    says: The findings are printed and the exit code is 1.
