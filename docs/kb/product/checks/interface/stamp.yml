says: 'The pytest plugin ogy ships: with --ogy-stamp the run writes the built lines.'
invoked_as: pytest --ogy-stamp (just stamp)
form: cli
serves:
- product/checks/workflow/prove-built/step/run
src:
- code:src/ogy/stamping.py#stamp_passed
proof:
- tests/test_stamping.py::test_the_run_writes_a_line_only_for_an_entry_whose_proofs_all_passed
- tests/test_stamping.py::test_without_the_flag_or_for_a_proof_that_did_not_run_nothing_is_written
