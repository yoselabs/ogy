says: An agent or the owner brings the tracker's ogy tasks in line with the work left.
because:
- product/inspection/pain/tasks-drift
src:
- code:tools/ogy_beads.py#plan
realizes: product/inspection/capability/work-as-tracker-items
start: sync
steps:
  sync:
    says: The agent runs just beads to see the plan (create, rewrite and close by entry address; close an ogy-decision item once a kind file cites its decision), and just beads --apply to write it.
    actor: product/shared/actor/agent
    choices:
      sync:
        label: Sync the tracker
        then: synced
        proof:
        - tests/test_brief.py::test_the_tracker_items_are_the_whole_work_left_keyed_by_address
        - tests/test_ogy_beads.py::test_the_plan_makes_the_open_ogy_beads_match_the_work_left
        - tests/test_ogy_beads.py::test_apply_creates_with_the_label_then_writes_the_address_and_fingerprint
ends:
  synced:
    result: success
    says: Each work item has one task in the tracker that matches it, and no task outlives its work.
