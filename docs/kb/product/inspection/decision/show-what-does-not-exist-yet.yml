title: How the agent shows something that does not exist yet
question: When the agent explains an idea, such as a new workflow, a changed decision or a flow we are brainstorming, how does it show it on the board?
context: 'Owner, 2026-11-22: during a brainstorm the agent should be able to say here is how it would look, and create a new workflow with new parts just to show it, marked as preview only. Back in a week the owner should see what was only a sketch and say commit it, or settle it. Maybe nothing needs a mark: entries added by the agent are not agreed by the owner anyway. The board must reflect each agent call at once.'
options:
  both:
    label: 'Two ways: a sketch lives only in the running server, drawn as an illustration and gone when dismissed or when the server stops, and a promote call writes it into the knowledge base; anything written into the knowledge base by the agent stays unagreed by the owner, so it shows as such until he agrees or the agent removes it with a reason'
  unagreed-entries:
    label: The agent always writes real entries; unagreed ones are the preview and the board marks them
  illustration-only:
    label: The agent only shows sketches held in the server; real entries are written after the owner says so
proposal:
  chose: both
  why: A throwaway sketch must not pollute the knowledge base, and a sketch that matters must become a real entry in one call; the existing unagreed state already says what is not settled.
  heard: Wants to show how a new workflow would look as a preview, and later tell the agent to commit it, or see what is still only modelled.
