title: Which products ogy must describe
question: Where is it written which products the shipped ontology must be able to describe, so that a design pass judges a kind against them?
context: "Today nothing in the knowledge base says ogy must describe the task loop, a2kay or a healthcare system. So on 2026-11-24 three reviews judged where interface lives by counting ogy's own entries, and gave three answers. With the goal written, a review asks 'can the task loop's MCP server be written down?' and gets one answer. It is one entry, never more: adding or dropping a product is a new answer on this decision. Goal text (written with the answer): ogy describes, with no kind added for one of them, a task factory with outside triggers, AI steps and several interfaces; a knowledge base reached over MCP; a legacy system recovered from its code; and ogy itself."
structure: true
options:
  goal-and-cases:
    label: One goal in product/ontology says which sorts of product the ontology must describe; the named products are the folders of reference cases (software/ontology/decision/reference-cases). A product is added or dropped by answering this decision again, so its answers are the history
  goal-per-product:
    label: One goal per named product
  document:
    label: A document outside the knowledge base (README or docs/thoughts); no check reads it
  no:
    label: Not written; each design pass asks the owner
proposal:
  chose: goal-and-cases
  why: A goal is a result the product exists to reach, and this is one. One goal cannot pile up; the cases are counted by folders; a change of mind is a new answer here, not a new entry.
  heard: 'My intent is not written in the KB: nothing says ogy must describe the task loop.'
