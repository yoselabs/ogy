- id: remove-with-reason
  says: An agent deletes an entry only with a reason; an entry the base commit had, one a person agreed to, a decision with an answer or an option of one is kept in its area's removed ledger so its id is never reused.
  src:
  - code:src/ogy/removal.py#remove
  realizes:
  - product/removal/goal/nothing-silently-dropped
- id: list-dropped
  says: 'ogy lists what no person has seen: proposals that say no, removals whose reason is plain words, proposals that differ from the answer, answers with a hedge and answers given under a delegation.'
  src:
  - code:src/ogy/review.py#Dropped
  realizes:
  - product/removal/goal/nothing-silently-dropped
