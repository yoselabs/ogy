says: An agent removes an entry with a reason, and ogy records it in the removed ledger before deleting it.
src:
- code:src/ogy/removal.py#remove
trigger: actor
realizes: product/removal/capability/remove-with-reason
start: ask
steps:
  ask:
    says: The agent runs ogy remove <address> --why <reason>.
    actor: product/people/actor/agent
    choices:
      remove:
        label: Remove
        then: check
  check:
    says: ogy checks that the entry may go, then appends its item and deletes it.
    cases:
      linked:
        order: 1
        when:
          text: a live link or a decision in force names the entry or a part of it
        then: refused
      agreed-without-address:
        order: 2
        when:
          text: a person agreed to the entry and the reason is not the address of a decision
        then: refused
      otherwise:
        then: removed
        effects:
        - do: create
          on: product/removal/entity/removed-item
        - do: delete
          on: product/capture/entity/entry
ends:
  removed:
    result: success
    says: The entry is gone from its file and its item is in removed.yml.
  refused:
    result: failure
    says: Nothing is written; the refusal says why.
