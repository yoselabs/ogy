says: An agent removes an entry with a reason; ogy records it in the removed ledger when the base commit had it or ogy init starts with it, then deletes it.
src:
- code:src/ogy/removal.py#remove
realizes: product/removal/capability/remove-with-reason
start: ask
steps:
  ask:
    says: The agent runs ogy remove <address> --why <reason>.
    actor: product/shared/actor/agent
    choices:
      remove:
        label: Remove
        then: check
    agreed:
      at: '2026-11-19T18:43:39+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: Agreed to the seven, with CI's check sentence and the answered state corrected
      hash: b63584707194
  check:
    says: ogy checks that the entry may go.
    cases:
      linked:
        order: 1
        when:
          text: a live link or a decision in force names the entry or a part of it
          reads:
          - product/capture/entity/entry
        then: refused
      agreed-without-address:
        order: 2
        when:
          text: a person agreed to the entry and the reason is not the address of a decision
          reads:
          - product/capture/entity/entry/state/decided-by-you
        then: refused
      otherwise:
        then: removed
        effects:
        - do: create
          on: product/removal/entity/removed-item
        - do: delete
          on: product/capture/entity/entry
      single-part:
        order: 3
        when:
          text: the entry is of a kind its parent holds only one of
          reads:
          - product/capture/entity/entry
        then: refused
      bad-why:
        order: 4
        when:
          text: the reason looks like an address but names no live decision, or the replacement chain ends at no live entry
          reads:
          - product/removal/entity/removed-item
        then: refused
      blank-why:
        order: 0
        when:
          text: the reason is blank
          reads:
          - product/removal/entity/removed-item
        then: refused
    agreed:
      at: '2026-11-28T05:11:55+01:00'
      where: ai:claude/ontology-review-session-749f16
      said: Agreed the twenty cards the review found true or resting on answers already given
      hash: '480840469335'
ends:
  removed:
    result: success
    says: The entry is gone from its file. removed.yml holds its item if the base commit had the entry or ogy init starts with it; otherwise none (Git keeps it).
    agreed:
      at: '2026-11-28T05:11:55+01:00'
      where: ai:claude/ontology-review-session-749f16
      said: Agreed the twenty cards the review found true or resting on answers already given
      hash: d2423f23ccba
  refused:
    result: failure
    says: Nothing is written; the refusal says why.
    agreed:
      at: '2026-11-19T18:43:39+01:00'
      where: ai:claude/095b122d-a1b0-4f70-b4f0-5b1291469157
      said: Agreed to the seven, with CI's check sentence and the answered state corrected
      hash: 8d068712ca8c
