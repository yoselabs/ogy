# What `ogy init` starts a knowledge base with: each entry missing by address is added, unless a removed.yml records it.
# Nothing here is agreed: the owner reads and agrees to each in the first review (rule software/setup/rule/init-adapts).
- address: product/shared/actor/owner
  nature: human
  says: The person who decides the product's business questions, in natural language; never writes entries.
- address: product/shared/actor/agent
  nature: ai
  says: An AI model that works on the knowledge base through ogy; it decides only where the owner delegated.
