kind: case
because: [software/ontology/decision/guard-is-a-case]
about: "one condition of a system or calling step; the lowest `order` that matches wins; the case keyed `otherwise` has no `when`"
guidance: "A branch of a system or calling step: the path differs by a condition. The lowest `order` that matches wins; `otherwise` takes the rest. Use a case when the path differs; use a choice's `when` when the same screen offers fewer choices. A condition names in `reads` at least one entry it depends on, actors included."
like: "one arm of a switch, a BPMN conditional flow"
unlike: "a CMMN case"
shape: inline
part_of: step
key: cases
needs_proof: true
fingerprint: {proofs: true}
requires:
  - {if_part: effect, path: ["<-performs"], kinds: [handler], status: unhandled, error: "a row with an effect has a handler performing it"}
  - {if_reaches: ["on?nature=program"], path: ["on", "<-realizes", "<-uses", "performs"], kinds: [case, choice, timeout], same: true, status: unhandled, error: "a row that tells a program actor has a handler that uses a dependency realizing it"}
  - {if_reaches: ["on?nature=program"], path: ["^", "/case", "then?result=failure"], or_paths: [["then", "/timeout"], ["then", "/case", "then?result=failure"]], kinds: [timeout, end], work: true, status: no-answer-path, error: "a row that tells an outside system has a no-answer path: a timeout, or a case ending in failure, on its step or the next"}
  - {if_reaches: ["on?nature=program"], path: ["satisfies"], kinds: [rule], work: true, status: no-answer-path, error: "a row that tells an outside system has a no-answer path: a rule it satisfies says whether a repeat is safe"}
  - {if_reaches: ["on?@kind=dependency"], path: ["^", "/case", "then?result=failure"], or_paths: [["then", "/timeout"], ["then", "/case", "then?result=failure"]], kinds: [timeout, end], work: true, status: no-answer-path, error: "a row that tells an outside system has a no-answer path: a timeout, or a case ending in failure, on its step or the next"}
  - {if_reaches: ["on?@kind=dependency"], path: ["satisfies"], kinds: [rule], work: true, status: no-answer-path, error: "a row that tells an outside system has a no-answer path: a rule it satisfies says whether a repeat is safe"}
fields:
  satisfies: {type: links, to: [rule], note: true, input: content}   # the rules it is held to (behaviour: a rule it is held to changes, it is stale)
  order: {type: number}
  when: {type: expr, to: [quantity, enum, entity, attribute, state, dependency, setting, actor], input: none}
  covers_ends: {type: links, to: [end], input: none}   # in a calling step: the callee's ends this case answers
  then: {type: link, to: [step, end, workflow], required: true, input: none}
