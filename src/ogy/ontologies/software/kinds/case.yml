kind: case
about: "one condition of a system or calling step; the lowest `order` that matches wins; the case keyed `otherwise` has no `when`"
guidance: "A branch of a system or calling step: the path differs by a condition. The lowest `order` that matches wins; `otherwise` takes the rest. Use a case when the path differs; use a choice's `when` when the same screen offers fewer choices. A condition names in `reads` at least one entry it depends on, actors included."
like: "one arm of a switch, a BPMN conditional flow"
unlike: "a CMMN case"
shape: inline
part_of: step
key: cases
needs_proof: true
fingerprint: {proofs: true}
input: {satisfies: content}                         # a rule the row is held to changes: the row and its performer are stale
requires:
  - {if_part: effect, path: ["<-performs"], kinds: [handler], error: "a row with an effect has a handler performing it"}
fields:
  order: {type: number}
  when: {type: expr, to: [quantity, enum, entity, attribute, state, dependency, setting, actor], input: none}
  covers_ends: {type: links, to: [end], input: none}   # in a calling step: the callee's ends this case answers
  then: {type: link, to: [step, end, workflow], required: true, input: none}
