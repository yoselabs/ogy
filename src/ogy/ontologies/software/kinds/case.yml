kind: case
about: "one condition of a system or calling step; the lowest `order` that matches wins; the case keyed `otherwise` has no `when`"
guidance: "A branch of a system or calling step: the path differs by a condition. The lowest `order` that matches wins; `otherwise` takes the rest. Use a case when the path differs; use a choice's `when` when the same screen offers fewer choices. A condition may name actors."
shape: inline
part_of: step
key: cases
needs_proof: true
fingerprint:
  proofs: true
  also: [[by, "=@fingerprint"]]
requires:
  - {if_part: effect, path: ["<-performs"], kinds: [operation], error: "a row with an effect has an operation performing it"}
fields:
  order: {type: number}
  when: {type: expr, to: [value, set, entity, attr, state, external, config_key, actor]}
  covers_ends: {type: links, to: [end]}             # in a calling step: the callee's ends this case answers
  then: {type: link, to: [step, end, workflow], required: true}
  by: {type: links, to: [rule]}
