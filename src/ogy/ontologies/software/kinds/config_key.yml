kind: config_key
about: a real setting the product reads; a number it holds is a `value` it binds
guidance: "A real setting the product reads from a file or the environment, under its name. A number it holds is a value it binds, a closed list of words a set. A decided limit nobody configures is only a value."
shape: list
sentence: says
file: config-keys.yml
layers: [software]
needs_proof: true
fingerprint: {proofs: true}
fields:
  says: {required: true}
  name: {required: true}                             # the setting as written in the file or environment
  binds: {type: link, to: [value, set]}
dropped: [default, used_by]
