kind: step
about: "an actor step (choices, maybe a timeout), a system step (cases or one `then`) or a calling step (calls, cases over the callee's ends); no actor means the product itself"
guidance: "One place in a workflow: an actor step (choices, maybe a timeout), a system step (cases or one `then`) or a calling step (another workflow, cases over its ends). No actor means the product acts. Start a new step when another actor acts or the product waits."
shape: inline
part_of: workflow
key: steps
needs_proof: true
fingerprint: {proofs: true}
requires:
  - {if_set: actor, path: ["<-serves"], kinds: [view, command], error: "an actor step has a view or command that serves it"}
  - {if_set: actor, path: [/choice], kinds: [choice], without: [when], error: "an actor step offers at least one choice without `when`"}
fields:
  says: {}
  actor: {type: link, to: [actor]}
  then: {type: link, to: [step, end, workflow]}
  calls: {type: link, to: [workflow]}
