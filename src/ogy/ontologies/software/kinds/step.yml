kind: step
because: [software/ontology/decision/exits-on-rows, software/ontology/decision/unserved-step-is-work, software/ontology/decision/work-status-unserved]
about: "an actor step (choices, maybe a timeout), a system step (cases; one `otherwise` case when it only goes on) or a calling step (calls, cases over the callee's ends); no actor means the product itself"
guidance: "One place in a workflow: an actor step (choices, maybe a timeout), a system step (cases; one `otherwise` case to only go on) or a calling step (another workflow, cases over its ends). No actor means the product acts. Start a new step when another actor acts or the product waits."
like: "a BPMN task: one place in a workflow where an actor or the product acts"
unlike: "a UML activity; a step of a wizard screen"
shape: inline
sentence: says
part_of: workflow
key: steps
requires:
