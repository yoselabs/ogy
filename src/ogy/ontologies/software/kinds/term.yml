kind: term
about: a word of the glossary, the one language of the product
shape: list
file: terms.yml
area: glossary                                       # one global list; a `terms.yml` in any other area is `bad-path`
must_be_agreed: true                                 # agreed in a review round, or proposed by a decision with no answer yet
exactly_one_of: [[says, of]]                         # a meaning has one home
fields:
  word: {required: true}                             # the word people say (`land`, `X`, `task tracker`); a term writes no `title`
  says: {}                                           # the definition, one sentence
  of: {type: link, to: [any]}                        # the entry that models this word; any kind but `term`
  distinct: {type: texts}                            # what it is not
  avoid: {type: texts}                               # words and phrases never used for this concept; retired names live here
  example: {note: true}
  borrowed: {type: uri, schemes: [https], note: true}   # the page the word is borrowed from
  group: {note: true}                                # the heading `ogy glossary` prints it under
