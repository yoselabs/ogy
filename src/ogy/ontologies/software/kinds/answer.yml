kind: answer
about: "a person (or an agent under their delegation) chose an option; ogy keeps no message and no quote, only a short paraphrase of what was said, who, when and where; the answer with the newest `at` is in force; \"no\" is an answer that chose an option that sets `null`"
guidance: "Written only by `ogy answer` or `ogy reply`, never by `put`: the owner's choice of an option, with a short paraphrase. A changed mind is a new answer; never edit one. Answer for the owner only under a delegation they gave (`--delegated`)."
shape: inline
part_of: decision
key: answers
holds: list
append_only: true
fields:
  chose: {type: link, to: [option], required: true}
  said: {note: true, required: true}                 # one short line: the AI's paraphrase of what the person said, fitted to the decision; never their words verbatim
  from: {type: enum, of: [human, ai], required: true}   # who chose: a person, or an agent under `delegated`
  at: {type: time, required: true}                   # date, time and timezone offset; the newest is in force
  where: {type: uri, schemes: [ai, call, jira, bd, email, file], required: true}   # the session, e.g. ai:claude/<session-id>
  note: {note: true}                                 # the person's hedge or condition, paraphrased ("for now", "on condition that ..."); outside the fingerprint
  delegated: {type: link, to: [decision]}            # with `from: ai`: the decision whose human answer let the agent decide this
