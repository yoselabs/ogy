kind: workflow
because: [software/ontology/decision/trigger-computed, software/ontology/decision/workflow-owes-capability]
about: a result reached by steps; branching is `then` targets, merging is two rows naming one step
guidance: "A result reached by steps, started by an actor on its first step, a `schedule`, an `event`, the product step it `details`, or a caller's `then` or `calls`. What the system does again and again is a scheduled workflow; a one-off act is a plain task outside the ontology. Branch with `then`; merge by naming one step from two rows."
like: "a BPMN process: a result reached by steps"
unlike: "a CI pipeline outside the product; a one-off task"
shape: file
sentence: says
layers: [product, software]
flow:                                                # makes it a graph: the kinds and fields the flow checks read (kinds.Flow)
  start: start                                       # the container field naming the first step
  roots: [schedule, event, details]                  # container fields that start it from outside, as an actor on the first step does
  step: step
  end: end
  choice: choice                                     # rows of an actor step
  case: case                                         # rows of a system or calling step, lowest `order` first
  timeout: timeout                                   # the optional timeout row of an actor step
  then: then                                         # the edge, on a step or on a row
  actor: actor
  calls: calls
  covers: covers_ends                                # a calling step's case names the callee ends it answers
  when: when
  order: order
  otherwise: otherwise                               # the local key of the one case without a condition
  serves: serves
  servers: [interface]                               # the kinds that serve a step to its actor
  offers: offers                                     # a server offering only some choices lists them
  group: realizes                                    # `ogy work` groups the work of a workflow by the capability it realizes
dropped: [trigger]                                   # who starts it is computed from the links (decision software/ontology/decision/trigger-computed)
requires:                     # owner (decision workflow-owes-capability): a workflow belongs to what the product offers, or is part of another flow
  - {path: [realizes], or_paths: [["<-calls"], ["<-then"], [details]], kinds: [capability, step, case, choice, timeout], work: true, status: unrealized, error: "a workflow realizes a capability, or a step calls it, a row leads to it or it details a step"}
fields:
  satisfies: {type: links, to: [rule], note: true, input: none}   # the rules it is held to
  says: {required: true}                             # the result it reaches
  schedule: {type: link, to: [quantity]}                # started on this clock
  event: {type: link, to: [transition]}              # started when this transition happens; the listener names it, the cause does not
  details: {because: [software/ontology/decision/software-workflow-start], type: link, to: [step]}                  # a software flow behind a product step: started through it, no actor step (decision software-workflow-start)
  start: {type: link, to: [step], required: true}
  realizes: {type: link, to: [capability]}
