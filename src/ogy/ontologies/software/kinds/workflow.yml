kind: workflow
about: a result reached by steps; branching is `then` targets, merging is two rows naming one step
guidance: "A result reached by steps, started by an actor on its first step, a `schedule`, an `event`, or a caller's `then` or `calls`. What the system does again and again is a scheduled workflow; a one-off act is a plain task outside the ontology. Branch with `then`; merge by naming one step from two rows."
shape: entity
layers: [product, software]
flow: {}
dropped: [trigger]                                   # who starts it is computed from the links (decision software/ontology/decision/trigger-computed)
fields:
  says: {required: true}                             # the result it reaches
  schedule: {type: link, to: [value]}                # started on this clock
  event: {type: link, to: [transition]}              # started when this transition happens; the listener names it, the cause does not
  start: {type: link, to: [step], required: true}
  realizes: {type: link, to: [capability]}
