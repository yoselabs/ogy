kind: attr
about: one fact kept about an entity
guidance: "A fact kept about an entity. A fact computed from others is `derived` and never written. A link to another entity is type `one` with `of`. A fact that changes the outcome is tested in a case; a move the product records and reacts to is a state, not an attribute."
shape: inline
sentence: says
part_of: entity
key: attrs
requires:
  - {if_equals: {field: type, value: one}, needs_field: of, error: "an attribute of type one names what it holds"}   # a list of plain texts names nothing: decision list-attr-of
  - {if_set: derived, kinds: [attr], without: [max, optional], error: "a derived attribute has no max and is never optional"}
fields:
  says: {}
  type: {type: enum, of: [text, number, flag, money, date, time, duration, counter, one, list], required: true}
  of: {type: link, to: [set, entity]}                # for `one` and `list`: what it holds
  max: {type: link, to: [value]}
  optional: {type: flag}
  derived: {type: expr, to: [value, set, entity, attr, state, external, config_key, actor]}   # computed from what it reads, never written
