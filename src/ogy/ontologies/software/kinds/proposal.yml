kind: proposal
was: {kind: guess, key: guess}
about: the option the AI would choose, and why; what is built while a decision has no answer; on an answered decision, a proposal newer than the newest answer asks the question again while the answer stays in force; it chooses an option; a proposal of "no" chooses an option that sets `null`
guidance: "The option the AI would choose, and why; built while the decision has no answer. On an answered decision ogy stamps `at` (never a hand) and asks the question again; the answer stays in force until the owner picks a letter. `heard`: what the owner said that it rests on, paraphrased. A proposal is never an answer."
like: "an ADR with status proposed: what is built until the owner answers"
unlike: "an answer: nobody said yes to it"
shape: inline
part_of: decision
key: proposal
holds: one
because: [software/ontology/decision/unused-values]
fields:
  chose: {type: link, to: [option], required: true}
  why: {note: true, required: true}
  heard: {note: true}                                # one short line: the AI's paraphrase of what the owner said, never a quote
  at: {because: [software/ontology/decision/re-ask-conditions], type: time}                                   # stamped by `put` when the decision has an answer; newer than the newest answer: asked again (decision re-ask-conditions)
dropped: [value, sets]                               # a proposal chooses an option; its own values could never be answered (unused-values)
folded: {heard: said}                                # the part heard {said} is now this text field (`ogy migrate`)
