kind: area
about: "what one area of a layer covers, so an agent knows what belongs there and what belongs next door; which product areas a software area builds is computed from links, never stored"
shape: single
file: area.yml          # <layer>/<area>/area.yml; its id is the area's name
every_area: true        # an area folder without its area.yml is `missing-entry`
evidence: none          # it describes a folder from what the folder holds; it is no claim about the product
asked: false            # never a review card, never agreed
layers: [product, software]
fields:
  says: {required: true}                             # one sentence: what the area covers
  distinct: {type: texts}                            # what belongs in a neighbouring area, not here
