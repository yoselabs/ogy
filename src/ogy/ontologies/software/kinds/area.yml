kind: area
about: "what one area of a layer covers, so an agent knows what belongs there and what belongs next door; which product areas a software area builds is computed from links, never stored"
guidance: "One topic of a layer, named for what it covers, never after the product. An entry goes where `says` covers it; `unlike` links the areas next door, and `says` ends `Not here: <what>: <area>`. What two areas use (a term, an actor, an enum) goes in `shared`. Change an entry's area only with `ogy move`."
like: "a module or product area: one topic of a layer"
unlike: "a DDD bounded context: the glossary is one language"
shape: single
sentence: says
file: area.yml          # <layer>/<area>/area.yml; its id is the area's name
every_area: true        # an area folder without its area.yml is `missing-entry`
evidence: none          # it describes a folder from what the folder holds; it is no claim about the product
asked: false            # never a review card, never agreed
layers: [product, software]
shared: true            # the area `shared` holds its own area.yml too
renamed: {distinct: unlike}
fields:
  says: {required: true}                             # one sentence: what the area covers
  unlike: {type: links, to: [area]}                  # the neighbouring areas whose topic is close: a renamed area follows
