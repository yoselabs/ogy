kind: timeout
about: what happens when the actor does nothing for a time
guidance: "What happens when the actor does nothing for a decided time, a quantity. Only an actor step has one; something the system does on a clock is a workflow with a `schedule`."
like: "a BPMN timer event on an actor's wait"
unlike: "a schedule: something the system does on a clock is a workflow"
shape: inline
part_of: step
key: timeout
holds: one
needs_proof: true
fingerprint: {proofs: true}
requires:
  - {if_part: effect, path: ["<-performs"], kinds: [handler], status: unhandled, error: "a row with an effect has a handler performing it"}
  - {if_reaches: ["on?nature=program"], path: ["on", "<-realizes", "<-uses", "performs"], kinds: [case, choice, timeout], same: true, status: unhandled, error: "a row that tells a program actor has a handler that uses a dependency realizing it"}
fields:
  satisfies: {type: links, to: [rule], note: true, input: content}   # the rules it is held to (behaviour: a rule it is held to changes, it is stale)
  after: {type: link, to: [quantity], required: true, input: {fields: [is, unit]}}   # the number and unit, not its words
  then: {type: link, to: [step, end, workflow], required: true, input: none}
