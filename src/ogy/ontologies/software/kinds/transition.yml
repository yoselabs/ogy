kind: transition
about: one allowed move between states of an entity
guidance: "One allowed move between states of an entity; without `from` the entity is created in `to`. Model a move the product records and reacts to; a plain change of a fact is a `write` to an attribute."
like: "a UML state machine transition"
unlike: "a plain change of a fact, which is a write"
shape: inline
part_of: entity
key: transitions
requires:
  - {path: ["<-on?do=move"], kinds: [case, choice, timeout], work: true, status: unused, error: "a transition no effect fires"}
fields:
  from: {type: links, to: [state]}                   # left out: the entity is created in `to`
  to: {type: link, to: [state], required: true}
