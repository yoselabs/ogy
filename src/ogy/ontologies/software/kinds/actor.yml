kind: actor
about: "whoever uses or operates the product: a person, an AI or a third-party system that invokes a workflow; human: a librarian at the desk; ai: a model that implements a task; program: an MCP client calling a tool"
guidance: "Different permitted actions make a new actor. A recorded move the product reacts to is an entity's state; a fact that changes the outcome is an attribute tested in a case. A threshold name (a large order) is never an actor. Name a product actor by its role (payment-provider, not a vendor), so swapping the vendor touches software only."
like: "a UML actor"
unlike: "an ArchiMate business actor (that is our actor's organisation); a role kind"
shape: list
sentence: says
file: actors.yml
evidence: none          # who uses the product, not a claim
layers: [product, software]   # a party the business deals with in product, whatever its nature; one that exists only because of how
                              # the product is built (a scheduler, CI, a git hook, an MCP client) in software
shared: true                  # an actor two areas use lives in <layer>/shared/actors.yml
fields:
  says: {required: true}
  nature: {type: enum, of: [human, ai, program], required: true}
