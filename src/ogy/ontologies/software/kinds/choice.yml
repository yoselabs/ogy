kind: choice
about: one thing the actor is offered, with one `then`
guidance: "What an actor may pick at one step, with its `then`. Add `when` when the same screen offers fewer choices while a condition holds (who may see it); keep one choice without `when`. When the path differs by a fact nobody picks, use a system step with cases."
shape: inline
sentence: label
part_of: step
key: choices
needs_proof: true
fingerprint:
  proofs: true
  also: [[by, "=@fingerprint"]]                      # a rule the row names changes: the row and its performer are stale
requires:
  - {if_part: effect, path: ["<-performs"], kinds: [operation], error: "a row with an effect has an operation performing it"}
fields:
  label: {required: true}
  when: {type: expr, to: [value, set, entity, attr, state, external, config_key, actor], harm: [who-is-allowed]}   # offered only while it holds; the step keeps one choice without it
  then: {type: link, to: [step, end, workflow], required: true}
