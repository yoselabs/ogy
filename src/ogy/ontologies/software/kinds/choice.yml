kind: choice
about: one thing the actor is offered, with one `then`
guidance: "What an actor may pick at one step, with its `then`. Add `when` when the same screen offers fewer choices while a condition holds (who may see it); keep one choice without `when`. When the path differs by a fact nobody picks, use a system step with cases."
like: "a button or command offered to the actor"
unlike: "a UML choice pseudostate"
shape: inline
sentence: label
part_of: step
key: choices
needs_proof: true
fingerprint: {proofs: true}
requires:
  - {if_part: effect, path: ["<-performs"], kinds: [handler], error: "a row with an effect has a handler performing it"}
fields:
  satisfies: {type: links, to: [rule], note: true, input: content}   # the rules it is held to (behaviour: a rule it is held to changes, it is stale)
  label: {required: true}
  when: {type: expr, to: [quantity, enum, entity, attribute, state, dependency, setting, actor], harm: [authorization], input: none}   # offered only while it holds; the step keeps one choice without it
  then: {type: link, to: [step, end, workflow], required: true, input: none}
