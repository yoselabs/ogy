kind: command
about: a command line or API call that serves actor steps
guidance: "A command line or API call that serves actor steps, as a view serves a screen; `offers` lists the choices when it offers only some. The code that does the work behind a row is an operation."
shape: entity
layers: [software]
needs_proof: true
fingerprint:
  proofs: true
  also: [[serves, /choice, "=@id"]]
fields:
  says: {required: true}
  invoked_as: {required: true}
  serves: {type: links, to: [step], required: true}
  offers: {type: links, to: [choice]}
