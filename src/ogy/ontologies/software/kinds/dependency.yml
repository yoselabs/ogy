guidance: "`pin` says which version; its surprises are workarounds; choosing it is a decision. A system that calls us is an actor. The product layer never names a dependency: a row tells a program actor (a payment provider), the dependency `realizes` it and the handler performing the row `uses` the dependency."
like: "a package or service dependency: something we call and do not own"
unlike: "a UML dependency arrow; a system that calls us, which is an actor"
harm: [tells-outside]
