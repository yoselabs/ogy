# Where entries live. The loader enforces it; no flag, setting or field skips a level.
#   <layer>/<area>/<kind>/<id>.yml     a file kind
#   <layer>/<area>/<file>              a list kind (the kind's `file`), or a single kind: one entry whose id is the area
#                                      (`area.yml`; `every_area` makes an area without it `missing-entry`)
#   <folder>/<file>                    a kind that names a fixed folder with `area` (the glossary, the constitution)
# A kind lists the layers it may appear in (`layers:`); the folder is the layer's only home.
layers: [product, software]                          # in order
link_direction: later-to-earlier                     # a link stays in its layer or names an earlier one: software names product,
                                                     # product never names software (`layer-direction`)
shared:                                              # the reserved area of every layer: what two of its areas use
  area: shared
  says: "What two or more areas of this layer use: their shared terms, actors and enums."
# Fields every entry may carry beside its kind's. `src` says where a sentence came from; `agreed` is the person's yes to it in
# a review round (written only by `reply`).
common:
  title: {note: true}
  src: {type: texts, note: true}
  because: {type: links, to: [principle, decision, pain], input: none}   # the reason: a principle, a decision or a pain, never a source
  proof: {type: texts}
  agreed: {type: agreed, note: true}
roles: {title: title, src: src, because: because, proof: proof, agreed: agreed}   # which common field the engine reads for what
# What goes wrong if an entry's sentence is wrong; the order is the order the review asks them in.
harms: [tells-outside, irreversible, authorization]
evidence:                                            # the schemes of `src` items
  code: {reads: symbol, files: [.py]}                # code:<path>#<symbol>
  doc: {reads: section, files: [.md], pinned: true}  # doc:<commit>:<path>#<anchor>
proof: {files: [.py]}                                # <path>.py::<function>
reserved:
  computed: [open, assumed, origin, status, author, agreement, built, covers, sourced, in, retired, accepted_by, renamed_from,
             actors, subject, id, settles, settled_by, came_from, removed, replaced_by, superseded, superseded_by, deprecated,
             restored, scope, history, changelog, last_seen]    # facts the tool computes; no kind may store them (K22)
  sentence: [states, means, holds, does, provides, goal]  # a kind names its sentence with `sentence:` (K25)
# The groups of the kinds that stand on their own, in the order `ogy kinds --map` prints them; every such kind is in exactly
# one (decision software/ontology/decision/kind-groups, answered declared).
groups:
  why: {says: "the reason anything is built: a pain, the goal that answers it, the capability that realizes it", kinds: [pain, goal, capability]}
  data: {says: "who acts and what the product holds", kinds: [actor, entity, enum, quantity, rule]}
  flows: {says: "what happens, and where a person or a program meets it", kinds: [workflow, interface]}
  build: {says: "what the software adds: its handlers, settings and dependencies", kinds: [handler, setting, dependency]}
  record: {says: "what the rest is read against: decisions, principles, words and areas", kinds: [decision, principle, term, area]}
