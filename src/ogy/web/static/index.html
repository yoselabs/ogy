<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ogy board</title>
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <div class="board-shell">
    <header class="board-header flex items-center justify-between gap-4">
      <h1>ogy board</h1>
      <p id="status" role="status">Loading…</p>
    </header>
    <main id="stage" class="board-canvas" aria-label="Ontology board">
      <svg id="board" aria-label="Entries" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
      <div id="overview" hidden></div>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
